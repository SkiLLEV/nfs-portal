<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | Leaderboard</title>

  <link rel="icon" href="https://i.postimg.cc/htQQdS85/IMG-3707.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>


  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-dark: rgba(15, 15, 15, 0.98);
      --nfs-border: #333;
      --admin-red: #e74c3c;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #191919;
      background-size: 100% 2px, 3px 100%, auto;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
      color: #fff;
      font-family: 'Wallpoet', sans-serif !important;
      padding-bottom: 60px;
      overflow-x: hidden;

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* ШАПКА */
    .top-navbar {
      height: 70px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      box-sizing: border-box;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
      repeating-linear-gradient(
        -45deg,
        #0a0a0a,
        #0a0a0a 40px,
        rgba(241, 196, 15, 0.4) 40px,
        rgba(241, 196, 15, 0.4) 80px
      );
      border-bottom: 2px solid var(--nfs-yellow);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.7);
    }

    #displayNick {
      font-family: 'Wallpoet', sans-serif !important;
    }

    #displayNick:hover {
      text-decoration: underline;
    }

    /* УВЕДОМЛЕНИЯ */
    .notifications-wrapper {
      position: relative;
      margin-right: 20px;
      display: flex;
      align-items: center;
    }

    #notifyBell {
      cursor: pointer;
      position: relative;
      font-size: 22px;
      transition: 0.2s;
    }

    #notifyBell:hover {
      transform: scale(1.1);
    }

    #notifyCount {
      position: absolute;
      top: -5px;
      right: -8px;
      background: var(--admin-red);
      color: white;
      border-radius: 50%;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid white;
      display: none;
    }

    .main-sidebar {
      width: 250px;
      background: linear-gradient(
        to right,
        rgba(5, 5, 5, 0.98) 0%,
        rgba(12, 12, 12, 0.95) 60%,
        rgba(20, 20, 20, 0.85) 100%
      );
      backdrop-filter: blur(4px);
      height: auto;
      position: fixed;
      top: 70px;
      left: 0;
      border-right: 2px solid var(--nfs-border);
      padding-top: 0px;
      z-index: 999;
    }

    .btn-exit:hover {
      background: rgba(255, 68, 68, 0.2) !important;
      color: #ff6666 !important;
      border-color: #ff4444 !important;
    }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      transition: 0.3s;
      font-size: 0.85rem;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(241, 196, 15, 0.1);
    }

    #msgBadge {
      background: var(--nfs-yellow);
      color: #000;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 900;
      border-radius: 2px;
      margin-left: 8px;
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
      display: none;
    }

    .container {
      margin-left: 250px;
      padding: 100px 50px 50px;
    }

    h1 {
      font-style: italic;
      text-transform: uppercase;
      border-bottom: 3px solid var(--nfs-yellow);
      display: inline-block;
      margin-bottom: 30px;
    }

    .blacklist-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.85);
    }

    .blacklist-table th {
      text-align: left;
      padding: 15px;
      background: #111;
      color: var(--nfs-yellow);
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .blacklist-table td {
      padding: 15px;
      border-bottom: 1px solid #222;
    }

    .blacklist-row:hover {
      background: rgba(241, 196, 15, 0.05);
      cursor: pointer;
    }

    .nfs-font {
      font-family: 'Wallpoet', sans-serif !important;
    }

    .rank-num {
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      color: #444;
      width: 50px;
    }

    .top-rank {
      color: var(--nfs-yellow);
      text-shadow: 0 0 10px var(--nfs-yellow);
    }

    .racer-avatar {
      width: 45px;
      height: 45px;
      border: 2px solid #444;
      object-fit: cover;
      background: #111;
      transition: 0.3s;
    }

    .racer-name {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 1) 0%,
        rgba(10, 10, 10, 0.95) 50%,
        rgba(20, 20, 20, 0.9) 100%
      );
      backdrop-filter: blur(4px);
      padding: 15px 0;
      border-top: 2px solid var(--nfs-yellow);
      text-align: center;
      font-size: 0.9rem;
      z-index: 1000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .highlight {
      color: var(--nfs-yellow) !important;
      font-weight: bold;
    }

    /* СТИЛИ ДЛЯ ВСПЛЫВАЮЩИХ ОКОН САППОРТА */
    .support-link {
      color: var(--nfs-yellow) !important;
      cursor: pointer;
      transition: 0.2s;
    }

    .support-link:hover {
      color: #ff4444 !important;
      text-decoration: underline;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 2000;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0d0d0d;
      padding: 40px;
      border: 2px solid var(--nfs-yellow);
      width: 320px;
      z-index: 2100;
      text-align: center;
      border-radius: 12px;
    }

    .modal input[type="text"], .modal textarea {
      width: 100%;
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.9rem;
      font-family: 'Arial', sans-serif !important;
    }

    .modal input:focus, .modal textarea:focus {
      border-color: var(--nfs-yellow);
      outline: none;
    }

    .btn-login {
      background: var(--nfs-yellow);
      border: none;
      padding: 10px 30px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .btn-login:hover {
      background: #c10e0e;
      color: #fff;
    }

    /* ПОЛИРОВКА СТИЛЯ: RESIDENT EVIL NOISE ANIMATION */
    .cover-noise {
      position: fixed;
      top: -50%;
      left: -50%;
      right: -50%;
      bottom: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 9999;
      animation: reNoiseAnimation 0.15s steps(2) infinite;
    }

    @keyframes reNoiseAnimation {
      0% {
        transform: translate(0, 0);
      }
      10% {
        transform: translate(-1%, -1%);
      }
      20% {
        transform: translate(-2%, 1%);
      }
      30% {
        transform: translate(1%, -2%);
      }
      40% {
        transform: translate(-1%, 3%);
      }
      50% {
        transform: translate(-2%, 1%);
      }
      60% {
        transform: translate(1%, 2%);
      }
      70% {
        transform: translate(2%, -2%);
      }
      80% {
        transform: translate(-1%, -1%);
      }
      90% {
        transform: translate(2%, 1%);
      }
      100% {
        transform: translate(1%, -1%);
      }
    }

    /* ВОЗВРАЩАЕМ РОДНЫЕ ДЕРЗКИЕ СТИЛИ ЛИДЕРБОРДА */
    .blacklist-table th,
    .racer-status {
      font-family: 'Wallpoet', sans-serif !important;
    }

    .racer-status {
      font-size: 0.85rem !important;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* АДАПТИВНАЯ ВЕРСТКА */
    @media screen and (max-width: 768px) {
      .top-navbar {
        padding: 0 15px !important;
      }

      #displayNick {
        font-family: 'Wallpoet', sans-serif !important;
        max-width: 80px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .main-sidebar {
        position: relative !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin-top: 70px !important;
        border-right: none !important;
        border-bottom: 2px solid var(--nfs-border) !important;
        z-index: 999 !important;
      }

      .main-sidebar nav {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: space-around !important;
      }

      .nav-item {
        flex: 1 1 30% !important;
        min-width: 95px !important;
        padding: 12px 5px !important;
        font-size: 0.75rem !important;
        text-align: center !important;
        border-bottom: 1px solid #222 !important;
        box-sizing: border-box !important;
      }

      .nav-item:hover, .nav-item.active {
        border-left: none !important;
        border-bottom: 3px solid var(--nfs-yellow) !important;
      }

      .container {
        margin-left: 0 !important;
        padding: 20px 10px 100px 10px !important;
        box-sizing: border-box !important;
        width: 100% !important;
        overflow-x: auto;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 20px;
        display: block;
        text-align: center;
      }

      .blacklist-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      .blacklist-table th,
      .blacklist-table td {
        padding: 10px 8px !important;
        font-size: 0.85rem;
      }

      .rank-num {
        font-size: 1.1rem !important;
        width: 35px !important;
      }

      .rank-num.top-rank {
        font-size: 1.4rem !important;
      }

      .racer-avatar {
        width: 35px !important;
        height: 35px !important;
      }

      .racer-name {
        font-size: 0.95rem !important;
      }

      .bottom-bar {
        font-size: 0.75rem !important;
        padding: 12px 0 !important;
      }

      .modal {
        width: 85%;
        padding: 25px 15px;
      }
    }
  </style>
</head>
<body>

<div class="cover-noise"></div>

<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 20px;">
    <img src="https://i.postimg.cc/KjhYnZ7S/IMG-4583.png"
         alt="NFS Logo"
         style="height: 65px; width: auto; filter: drop-shadow(2px 2px 8px #000);">

    <div
      style="font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 5px #000; font-style: italic; text-transform: uppercase;">
      LEADERBOARD
    </div>
  </div>

  <div class="user-area" style="display: flex; align-items: center; gap: 20px;">
    <div class="notifications-wrapper" id="notifyWrapper"
         style="position: relative; display: flex; align-items: center;">
      <div id="notifyBell" onclick="toggleNotifyPopup()" style="cursor: pointer; display: flex; align-items: center;">
        <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notifyCount" style="margin-left: 5px;">0</span>
      </div>

      <div id="notifyPopup"
           style="display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a; border: 1px solid #333; z-index: 100; min-width: 200px; margin-top: 10px;">
        <div class="notify-header nfs-font"
             style="padding: 10px; color: #fff; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 0.8rem;">
          Friend requests
        </div>
        <div id="notifyList"></div>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="openModal()" style="display: none;">LOGIN</button>

    <div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 15px;">
      <span id="displayNick"
            style="font-weight: bold; cursor: pointer; color: #ffffff; text-shadow: 0 0 8px rgba(0,0,0,0.6);"
            onclick="window.location.href='profile.html'">
        Davenport
      </span>
      <button onclick="handleLogout()" class="nfs-font btn-exit"
              style="background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 5px; color: #ff4444; cursor: pointer; font-size: 0.75rem; padding: 6px 12px; font-weight: bold; text-transform: uppercase;">
        EXIT
      </button>
    </div>
  </div>
</header>

<aside class="main-sidebar">
  <nav>
    <a href="index.html" class="nav-item">MAIN</a>
    <a href="forum.html" class="nav-item">FORUM</a>
    <a href="chats.html" class="nav-item">MESSENGER<span id="msgBadge">0</span></a>
    <a href="leaderboard.html" class="nav-item active">LEADERBOARD</a>
    <a href="profile.html" class="nav-item">MY PROFILE</a>
  </nav>
</aside>

<div class="container">
  <h1>LIST OF LEADER'S</h1>
  <table class="blacklist-table">
    <thead>
    <tr>
      <th>PLACE</th>
      <th>PHOTO</th>
      <th>RACER</th>
      <th>RATING</th>
      <th>STATUS</th>
    </tr>
    </thead>
    <tbody id="blacklistBody"></tbody>
  </table>
</div>

<footer class="bottom-bar">
  <div class="stats">
    ONLINE: <span class="highlight" id="footerOnline">0</span> |
    IN THE RACE: <span class="highlight" id="footerPlaying">0</span> |
    <span class="support-link" onclick="openSupportModal()">Support<span id="supportAlertBadge"></span></span>
  </div>
</footer>

<div class="modal-overlay" id="supportModalOverlay" onclick="closeSupportModal()"></div>
<div class="modal" id="supportModal" style="width: 450px; padding: 25px;">
  <h2 style="color: var(--nfs-yellow); text-transform: uppercase; font-style: italic; margin-top: 0;">Contact
    Support</h2>

  <div id="supportReplyContainer"
       style="display:none; background: rgba(241, 196, 15, 0.05); border: 1px solid rgba(241, 196, 15, 0.2); border-left: 4px solid var(--nfs-yellow); padding: 15px; margin-bottom: 20px; text-align: left; border-radius: 4px; max-height: 200px; overflow-y: auto;">
    <div style="font-size: 0.75rem; color: #555; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">
      Ticket Subject:
    </div>
    <div id="supportUserSubject"
         style="color: var(--nfs-yellow); font-weight: bold; font-size: 0.95rem; text-transform: uppercase; font-style: italic; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;"></div>

    <div style="font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">Your
      Message:
    </div>
    <p id="supportUserDescriptionText"
       style="margin: 0 0 12px 0; color: #ccc; font-size: 0.9rem; font-family: 'Arial', sans-serif !important; line-height: 1.4; white-space: pre-line;"></p>

    <div id="adminResponseLabel"
         style="font-size: 0.75rem; color: var(--nfs-yellow); text-transform: uppercase; font-weight: bold; margin-bottom: 4px;">
      Support Response:
    </div>
    <p id="supportReplyText"
       style="margin: 0; color: #eee; font-size: 0.9rem; font-family: 'Arial', sans-serif !important; line-height: 1.4; white-space: pre-line;"></p>

    <div id="closeTicketSection"
         style="margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); text-align: right;">
      <span onclick="closeAndArchieveTicket()"
            style="color: #888; font-size: 0.75rem; text-decoration: underline; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: color 0.2s;"
            onmouseover="this.style.color='#ff4444'" onmouseout="this.style.color='#888'">
        ✖ Close Ticket & Create New
      </span>
    </div>
  </div>

  <div id="supportFormFields">
    <input type="text" id="supportSubject" placeholder="PROBLEM SUBJECT (e.g. Profile Error)">
    <textarea id="supportDescription" rows="2" placeholder="Describe your issue in detail here..."
              style="font-family: 'Arial', sans-serif !important; resize: none;"></textarea>
    <button class="btn-login nfs-font" id="supportSubmitBtn"
            style="width: 100%; margin-top: 15px; border-radius: 8px; padding: 10px;" onclick="submitSupportTicket()">
      SEND TICKET
    </button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUserId = null;
  let myUsername = "";
  let myProfile = null;
  let currentActiveTicketId = null;

  window.updateFriendsStatusOnly = function () {
    console.log("Лидерборд: радар обновился, перерисовываю статусы...");
    loadBlacklist();
  };

  window.onload = async () => {
    const {data: {user}} = await _supabase.auth.getUser();

    if (user) {
      currentUserId = user.id;
      const {data: p} = await _supabase.from('profiles').select('*').eq('id', user.id).single();

      if (p) {
        myProfile = p;
        myUsername = p.username;

        const nickEl = document.getElementById('displayNick');
        if (nickEl) nickEl.innerText = p.username;

        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('userInfo').style.display = 'flex';

        initGlobalStatus(_supabase, p);
        updateGlobalMsgBadge(_supabase, user.id);

        if (typeof updateFriendNotifications === 'function') {
          updateFriendNotifications();
        }
        initFooterStats();
        checkAdminReplies(); // Проверка обращений в саппорт при загрузке

        _supabase.channel('leaderboard-msg-updates')
          .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'direct_messages',
            filter: `receiver_id=eq.${user.id}`
          }, () => {
            updateGlobalMsgBadge(_supabase, user.id);
          })
          .subscribe();

        // Подписка на обновление ответов поддержки в реальном времени
        _supabase.channel('support-realtime')
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'support_tickets',
            filter: `user_id=eq.${user.id}`
          }, (payload) => {
            checkAdminReplies();
            if (payload.new.status === 'resolved' && !payload.new.is_read) {
              if (typeof playNotificationSound === 'function') playNotificationSound();
              if (typeof nfsNotify === 'function') nfsNotify('NEW RESPONSE FROM SUPPORT!', 'info');
            }
          })
          .subscribe();
      }
    } else {
      console.log("Вход в режиме гостя");
    }

    await loadBlacklist();
  };

  function initFooterStats() {
    const presenceChannel = _supabase.channel('online-stats');
    presenceChannel.on('presence', {event: 'sync'}, () => {
      const state = presenceChannel.presenceState();
      let total = 0;
      let playing = 0;

      for (const key in state) {
        total++;
        if (state[key][0]) {
          const s = state[key][0].status;
          if (s === 'IN-GAME' || s === 'LOOKING FOR GAME') playing++;
        }
      }

      document.getElementById('footerOnline').innerText = total;
      document.getElementById('footerPlaying').innerText = playing;
    }).subscribe();
  }

  async function loadBlacklist() {
    const {data, error} = await _supabase
      .from('profiles')
      .select('*')
      .order('rating', {ascending: false});

    if (error) return;

    const tbody = document.getElementById('blacklistBody');
    tbody.innerHTML = '';

    data.forEach((racer, index) => {
      const rank = index + 1;
      const isMe = myUsername === racer.username;
      const presence = (typeof onlineUsers !== 'undefined') ? onlineUsers[racer.username] : null;

      let statusText = "OFFLINE";
      let statusClass = "offline";
      let dotColor = "#555";

      if (presence && presence[0]) {
        statusClass = 'online';
        const pData = presence[0];

        if (pData.status === 'IN-GAME' || pData.status === 'LOOKING FOR GAME') {
          statusText = pData.status === 'LOOKING FOR GAME' ? 'LFG' : pData.status;
          dotColor = 'var(--nfs-yellow)';
        } else {
          statusText = 'ONLINE';
          dotColor = '#2ecc71';
        }
      }

      let crown = "";
      let nameStyle = "";
      let rowStyle = "";

      if (rank === 1) {
        crown = "👑 ";
        nameStyle = "color: #f1c40f; text-shadow: 0 0 15px #f1c40f; font-size: 1.3rem;";
        rowStyle = "background: rgba(241, 196, 15, 0.08); border-left: 5px solid #f1c40f;";
      } else if (rank === 2) {
        crown = "🥈 ";
        nameStyle = "color: #dfe6e9; text-shadow: 0 0 10px #dfe6e9;";
      } else if (rank === 3) {
        crown = "🥉 ";
        nameStyle = "color: #cd7f32; text-shadow: 0 0 10px #cd7f32;";
      }

      const avatarHTML = racer.avatar_url
        ? `<img src="${racer.avatar_url}" class="racer-avatar" style="${rank <= 3 ? 'border-color: var(--nfs-yellow);' : ''}">`
        : `<div class="racer-avatar" style="display:flex; align-items:center; justify-content:center; color:#555; font-weight:900; background:#111; border: 2px solid #444;">?</div>`;

      const row = document.createElement('tr');
      row.className = 'blacklist-row';
      if (rowStyle) row.setAttribute('style', rowStyle);
      if (isMe && rank > 1) row.style.background = "rgba(255, 255, 255, 0.08)";

      row.onclick = () => window.location.href = `profile.html?u=${racer.username}`;

      row.innerHTML = `
        <td class="rank-num ${rank <= 3 ? 'top-rank' : ''}" style="${rank <= 3 ? 'font-size: 2rem;' : ''}">
          #${rank}
        </td>
        <td>
           <div style="position: relative; display: inline-block;">
              ${avatarHTML}
              <div style="
                width:10px;
                height:10px;
                border-radius:50%;
                background: ${dotColor};
                position: absolute;
                bottom: 0;
                right: 0;
                border: 2px solid #000;
                ${presence ? `box-shadow: 0 0 5px ${dotColor};` : ''}
              "></div>
           </div>
        </td>
        <td>
          <span class="racer-name ${racer.is_admin ? 'admin-name' : ''}" style="${nameStyle}">
            ${crown}${racer.username} ${isMe ? '<small style="color:var(--nfs-yellow); font-size: 0.6rem;">(YOU)</small>' : ''}
          </span>
        </td>
        <td style="font-weight: bold; color: var(--nfs-yellow); font-size: 1.1rem;">
          ${(racer.rating || 0).toLocaleString()}
        </td>
        <td>
          <span class="racer-status ${statusClass}" style="border-color: ${dotColor}; color: ${dotColor}; transition: 0.3s;">
            ${statusText}
          </span>
        </td>
      `;
      tbody.appendChild(row);
    });
  }

  function toggleNotifyPopup() {
    const p = document.getElementById('notifyPopup');
    if (p) p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  async function updateFriendNotifications() {
    if (!currentUserId) return;
    const {data: requests} = await _supabase.from('friend_requests')
      .select('*')
      .eq('receiver_id', currentUserId)
      .eq('status', 'pending');

    const countEl = document.getElementById('notifyCount');
    const listEl = document.getElementById('notifyList');

    if (requests && requests.length > 0) {
      countEl.innerText = requests.length;
      countEl.style.display = 'flex';
      listEl.innerHTML = '';
      requests.forEach(req => {
        listEl.innerHTML += `
          <div class="notify-item" style="padding:10px; border-bottom:1px solid #222; color:#fff; font-size:0.8rem;">
            <b>${req.sender_name}</b> wants to be friends
            <div class="notify-btns" style="display:flex; gap:5px; margin-top:5px;">
              <button class="btn-acc" onclick="respondFriend('${req.id}', 'accepted')" style="flex:1; background:#f1c40f; border:none; cursor:pointer; font-weight:bold; font-size:10px;">OK</button>
              <button class="btn-rej" onclick="respondFriend('${req.id}', 'rejected')" style="flex:1; background:#333; color:#fff; border:none; cursor:pointer; font-size:10px;">NO</button>
            </div>
          </div>`;
      });
    } else {
      countEl.style.display = 'none';
      listEl.innerHTML = '<div style="padding:10px; font-size:10px; color:#444; text-align:center;">There are no requests</div>';
    }
  }

  async function respondFriend(reqId, status) {
    if (status === 'accepted') {
      await _supabase.from('friend_requests').update({status: 'accepted'}).eq('id', reqId);
    } else {
      await _supabase.from('friend_requests').delete().eq('id', reqId);
    }
    updateFriendNotifications();
  }

  async function handleLogout() {
    if (currentUserId) {
      await _supabase.from('profiles').update({status: 'OFFLINE'}).eq('id', currentUserId);
    }
    await _supabase.auth.signOut();
    window.location.href = 'auth.html';
  }

  // ==========================================================================
  // СЕКЦИЯ КОДА САППОРТА
  // ==========================================================================
  async function openSupportModal() {
    document.getElementById('supportModalOverlay').style.display = 'block';
    document.getElementById('supportModal').style.display = 'block';

    if (myProfile) {
      await _supabase
        .from('support_tickets')
        .update({is_read: true})
        .eq('user_id', myProfile.id)
        .eq('status', 'resolved');

      const badge = document.getElementById('supportAlertBadge');
      if (badge) badge.innerText = '';
    }
  }

  function closeSupportModal() {
    document.getElementById('supportModalOverlay').style.display = 'none';
    document.getElementById('supportModal').style.display = 'none';
  }

  async function submitSupportTicket() {
    if (!myProfile) {
      Swal.fire({
        title: 'ERROR',
        text: 'You must be logged in to contact support.',
        icon: 'error',
        background: '#111',
        color: '#fff',
        confirmButtonColor: '#f1c40f'
      });
      return;
    }

    const description = document.getElementById('supportDescription').value.trim();
    if (!description) {
      Swal.fire({
        title: 'WARNING',
        text: 'Please enter your message.',
        icon: 'warning',
        background: '#111',
        color: '#fff',
        confirmButtonColor: '#f1c40f'
      });
      return;
    }

    if (currentActiveTicketId) {
      const currentDesc = document.getElementById('supportUserDescriptionText').innerText;
      const updatedDescription = `${currentDesc}\n\n👉 You (Reply):\n${description}`;

      const {error} = await _supabase
        .from('support_tickets')
        .update({
          description: updatedDescription,
          status: 'pending',
          is_read: false
        })
        .eq('id', currentActiveTicketId);

      if (error) {
        Swal.fire({
          title: 'ERROR',
          text: 'Failed to send reply.',
          icon: 'error',
          background: '#111',
          color: '#fff',
          confirmButtonColor: '#f1c40f'
        });
      } else {
        document.getElementById('supportDescription').value = '';
        closeSupportModal();
        Swal.fire({
          title: 'SUCCESS',
          text: 'Your reply has been sent to support!',
          icon: 'success',
          background: '#111',
          color: '#fff',
          confirmButtonColor: '#f1c40f'
        });
        checkAdminReplies();
      }
    } else {
      const subject = document.getElementById('supportSubject').value.trim();
      if (!subject) {
        Swal.fire({
          title: 'WARNING',
          text: 'Please enter a subject.',
          icon: 'warning',
          background: '#111',
          color: '#fff',
          confirmButtonColor: '#f1c40f'
        });
        return;
      }

      const {error} = await _supabase.from('support_tickets').insert([{
        user_id: myProfile.id,
        username: myProfile.username,
        subject: subject,
        description: `👉 You:\n${description}`
      }]);

      if (error) {
        Swal.fire({
          title: 'ERROR',
          text: 'Failed to send ticket.',
          icon: 'error',
          background: '#111',
          color: '#fff',
          confirmButtonColor: '#f1c40f'
        });
      } else {
        document.getElementById('supportSubject').value = '';
        document.getElementById('supportDescription').value = '';
        closeSupportModal();
        Swal.fire({
          title: 'SUCCESS',
          text: 'Your ticket has been sent to the admin!',
          icon: 'success',
          background: '#111',
          color: '#fff',
          confirmButtonColor: '#f1c40f'
        });
        checkAdminReplies();
      }
    }
  }

  async function closeAndArchieveTicket() {
    if (!currentActiveTicketId) return;

    const {error} = await _supabase
      .from('support_tickets')
      .update({status: 'closed'})
      .eq('id', currentActiveTicketId);

    if (error) {
      Swal.fire({
        title: 'ERROR',
        text: 'Failed to close ticket.',
        icon: 'error',
        background: '#111',
        color: '#fff',
        confirmButtonColor: '#f1c40f'
      });
    } else {
      Swal.fire({
        title: 'CLOSED',
        text: 'Ticket closed! Now you can create a new one.',
        icon: 'success',
        background: '#111',
        color: '#fff',
        confirmButtonColor: '#f1c40f'
      });
      document.getElementById('supportSubject').value = '';
      document.getElementById('supportDescription').value = '';
      await checkAdminReplies();
    }
  }

  async function checkAdminReplies() {
    if (!myProfile) return;

    const {data: tickets} = await _supabase
      .from('support_tickets')
      .select('*')
      .eq('user_id', myProfile.id)
      .neq('status', 'closed')
      .order('created_at', {ascending: false});

    const badge = document.getElementById('supportAlertBadge');

    if (tickets && tickets.length > 0) {
      const latestTicket = tickets[0];
      currentActiveTicketId = latestTicket.id;

      if (latestTicket.status === 'resolved' && !latestTicket.is_read) {
        if (badge) badge.innerHTML = ' <span style="color: #ff4444; font-weight: 900;">(1)</span>';
      } else {
        if (badge) badge.innerText = '';
      }

      document.getElementById('supportUserSubject').innerText = latestTicket.subject || 'No Subject';
      document.getElementById('supportUserDescriptionText').innerText = latestTicket.description;

      document.getElementById('supportSubject').style.display = 'none';
      document.getElementById('supportDescription').placeholder = "Type your reply to support here...";
      document.getElementById('supportSubmitBtn').innerText = "SEND REPLY";

      if (latestTicket.admin_reply) {
        document.getElementById('supportReplyText').innerText = latestTicket.admin_reply;
        document.getElementById('adminResponseLabel').style.display = 'block';
        document.getElementById('supportReplyText').style.display = 'block';
        document.getElementById('closeTicketSection').style.display = 'block';
      } else {
        document.getElementById('adminResponseLabel').style.display = 'none';
        document.getElementById('supportReplyText').style.display = 'none';
        document.getElementById('closeTicketSection').style.display = 'none';
      }

      document.getElementById('supportReplyContainer').style.display = 'block';
    } else {
      currentActiveTicketId = null;
      if (badge) badge.innerText = '';
      document.getElementById('supportSubject').style.display = 'block';
      document.getElementById('supportDescription').placeholder = "Describe your issue in detail here...";
      document.getElementById('supportSubmitBtn').innerText = "SEND TICKET";
      document.getElementById('supportReplyContainer').style.display = 'none';
    }
  }
</script>
</body>
