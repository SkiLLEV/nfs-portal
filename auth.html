<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFS Portal | Login</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-dark: #0a0a0a;
      --nfs-border: #333;
    }

    body {
      background: url('https://i.postimg.cc/rwxyLfkM/2488101.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Wallpoet', sans-serif !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* БОЛЬШИЕ ЗАГОЛОВКИ НА ФОНЕ */
    .bg-game-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 4px 4px 0px #000, 0 0 20px rgba(255, 255, 255, 0.1);
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-align: center;
      user-select: none;
    }

    .bg-game-subtitle {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--nfs-yellow);
      text-shadow: 3px 3px 0px #000, 0 0 15px rgba(241, 196, 15, 0.3);
      letter-spacing: 8px;
      margin-top: 25px;
      text-align: center;
      user-select: none;
    }

    .auth-box {
      background: rgba(0, 0, 0, 0.92);
      border: 1px solid var(--nfs-border);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
      padding: 40px;
      width: 420px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }

    h2 {
      text-transform: uppercase;
      font-style: italic;
      border-bottom: 2px solid var(--nfs-border);
      padding-bottom: 10px;
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--nfs-yellow);
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      background: #1a1a1a;
      border: 1px solid var(--nfs-border);
      color: #fff;
      box-sizing: border-box;
      font-size: 0.9rem;
      font-family: 'Arial', sans-serif !important;
    }

    input:focus {
      border-color: var(--nfs-yellow);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--nfs-yellow);
      color: #000;
      margin-top: 15px;
    }

    .btn-primary:hover {
      background: #c10e0e;
      color: #ffffff;
    }

    .btn-secondary {
      background: none;
      color: #888;
      font-size: 0.75rem;
      margin-top: 20px;
      border: 1px solid transparent;
    }

    .btn-secondary:hover {
      color: var(--nfs-yellow);
      text-decoration: underline;
    }

    .error {
      color: #ff4d4d;
      font-size: 0.8rem;
      margin-bottom: 10px;
      display: none;
      font-weight: bold;
      background: rgba(255, 77, 77, 0.1);
      padding: 8px;
      border-left: 3px solid #ff4d4d;
      font-family: 'Arial', sans-serif !important;
    }

    /* ПОЛИРОВКА СТИЛЯ: RESIDENT EVIL NOISE ANIMATION */
    .cover-noise {
      position: fixed;
      top: -50%;
      left: -50%;
      right: -50%;
      bottom: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 9999;
      animation: reNoiseAnimation 0.15s steps(2) infinite;
    }

    @keyframes reNoiseAnimation {
      0% {
        transform: translate(0, 0);
      }
      10% {
        transform: translate(-1%, -1%);
      }
      20% {
        transform: translate(-2%, 1%);
      }
      30% {
        transform: translate(1%, -2%);
      }
      40% {
        transform: translate(-1%, 3%);
      }
      50% {
        transform: translate(-2%, 1%);
      }
      60% {
        transform: translate(1%, 2%);
      }
      70% {
        transform: translate(2%, -2%);
      }
      80% {
        transform: translate(-1%, -1%);
      }
      90% {
        transform: translate(2%, 1%);
      }
      100% {
        transform: translate(1%, -1%);
      }
    }

    /* АДАПТИВНОСТЬ ДЛЯ ДИСКОВ/МОБИЛОК */
    @media screen and (max-width: 480px) {
      .auth-box {
        width: 90% !important;
        padding: 25px 20px !important;
      }

      .bg-game-title {
        font-size: 2rem;
      }

      .bg-game-subtitle {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<div class="cover-noise"></div>

<div class="bg-game-title">NEED FOR SPEED</div>

<div class="auth-box">
  <h2 id="formTitle">Enter the game</h2>

  <div id="errorMsg" class="error"></div>

  <div id="authFields">
    <input type="email" id="email" placeholder="E-mail">
    <input type="text" id="username" placeholder="Your nickname" style="display: none;">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button class="btn btn-primary"
          id="mainBtn"
          style="border-radius: 10px"
          onclick="handleAuth()">Log in
  </button>

  <div style="text-align: center;">
    <button class="btn btn-secondary" id="toggleBtn" onclick="toggleForm()">
      No account? Sign up!
    </button>
  </div>
</div>

<div class="bg-game-subtitle">PORTAL</div>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let isLogin = true;

  function toggleForm() {
    isLogin = !isLogin;
    const errorEl = document.getElementById('errorMsg');
    errorEl.style.display = 'none';

    document.getElementById('formTitle').innerText = isLogin ? "Enter the game" : "Racer Registration";
    document.getElementById('username').style.display = isLogin ? "none" : "block";
    document.getElementById('mainBtn').innerText = isLogin ? "Log in" : "Create profile";
    document.getElementById('toggleBtn').innerText = isLogin ?
      "No account? Sign up!" : "Already have a profile? Log in.";
  }

  async function handleAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const username = document.getElementById('username').value.trim();

    if (!email || !password || (!isLogin && !username)) {
      showError("Fill in all the fields.");
      return;
    }

    if (isLogin) {
      // ЛОГИН
      const {data, error} = await _supabase.auth.signInWithPassword({email, password});
      if (error) showError(error.message);
      else window.location.href = 'index.html';
    } else {
      // РЕГИСТРАЦИЯ
      const {data, error} = await _supabase.auth.signUp({
        email,
        password,
        options: {
          data: {username: username},
          emailRedirectTo: window.location.origin + '/index.html'
        }
      });

      if (error) {
        showError(error.message);
      } else {
        Swal.fire({
          title: "DONE!",
          text: "Check your email for confirmation, or try logging in.",
          icon: "success",
          background: "#111",
          color: "#fff",
          confirmButtonColor: "#f1c40f"
        });
      }
    }
  }

  function showError(text) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.innerText = ">> " + text;
    errorEl.style.display = 'block';
  }
</script>
</body>
</html>
