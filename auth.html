<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFS Portal | Login</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>
</head>
<body class="auth-page">

<div class="cover-noise"></div>

<div class="bg-game-title">NEED FOR SPEED</div>

<div class="auth-box">
  <h2 id="formTitle">Enter the game</h2>

  <div id="errorMsg" class="error"></div>

  <div id="authFields">
    <input type="email" id="email" placeholder="E-mail">
    <input type="text" id="username" placeholder="Your nickname" style="display: none;">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button class="btn btn-primary" id="mainBtn" onclick="handleAuth()">
    Log in
  </button>

  <div class="toggle-container">
    <button class="btn btn-secondary" id="toggleBtn" onclick="toggleForm()">
      No account? Sign up!
    </button>
  </div>
</div>

<div class="bg-game-subtitle">PORTAL</div>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let isLogin = true;

  function toggleForm() {
    isLogin = !isLogin;
    const errorEl = document.getElementById('errorMsg');
    errorEl.style.display = 'none';

    document.getElementById('formTitle').innerText = isLogin ? "Enter the game" : "Racer Registration";
    document.getElementById('username').style.display = isLogin ? "none" : "block";
    document.getElementById('mainBtn').innerText = isLogin ? "Log in" : "Create profile";
    document.getElementById('toggleBtn').innerText = isLogin ?
      "No account? Sign up!" : "Already have a profile? Log in.";
  }

  async function handleAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const username = document.getElementById('username').value.trim();

    if (!email || !password || (!isLogin && !username)) {
      showError("Fill in all the fields.");
      return;
    }

    if (isLogin) {
      const {data, error} = await _supabase.auth.signInWithPassword({email, password});
      if (error) showError(error.message);
      else window.location.href = 'index.html';
    } else {
      const {data, error} = await _supabase.auth.signUp({
        email,
        password,
        options: {
          data: {username: username},
          emailRedirectTo: window.location.origin + '/index.html'
        }
      });

      if (error) {
        showError(error.message);
      } else {
        Swal.fire({
          title: "DONE!",
          text: "Check your email for confirmation, or try logging in.",
          icon: "success",
          background: "#111",
          color: "#fff",
          confirmButtonColor: "#f1c40f"
        });
      }
    }
  }

  function showError(text) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.innerText = ">> " + text;
    errorEl.style.display = 'block';
  }
</script>
</body>
</html>
