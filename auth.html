<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFS Portal | Login</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="auth-page">

<div class="cover-noise"></div>

<div class="bg-game-title">NEED FOR SPEED</div>

<div class="auth-box">
  <h2 id="formTitle">Enter the game</h2>

  <div id="errorMsg" class="error"></div>

  <div id="authFields">
    <input type="email" id="email" placeholder="E-mail">
    <input type="text" id="username" placeholder="Your nickname" style="display: none;">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button class="btn btn-primary" id="mainBtn" onclick="handleAuth()">
    Log in
  </button>

  <div class="toggle-container">
    <button class="btn btn-secondary" id="toggleBtn" onclick="toggleForm()">
      No account? Sign up!
    </button>
  </div>
</div>

<div class="bg-game-subtitle">PORTAL</div>

</body>
</html>
