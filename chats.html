<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | My Chats</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-dark: rgba(15, 15, 15, 0.98);
      --nfs-border: #333;
      --admin-red: #e74c3c;
      --nfs-bg: url('https://cdn.wallpapersafari.com/61/10/ixlZPs.jpg');
    }

    body {
      margin: 0; padding: 0;
      background: var(--nfs-bg) no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: 'Wallpoet', sans-serif !important;
      overflow: hidden;
    }

    /* ШАПКА */
    .top-navbar {
      height: 90px;
      position: fixed;
      top: 0; width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      box-sizing: border-box;
      background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        repeating-linear-gradient(
          -45deg,
          #0a0a0a,
          #0a0a0a 40px,
          rgba(241, 196, 15, 0.4) 40px,
          rgba(241, 196, 15, 0.4) 80px
        );
      border-bottom: 2px solid var(--nfs-yellow);
      box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    }

    /* УВЕДОМЛЕНИЯ */
    .notifications-wrapper { position: relative; margin-right: 20px; display: flex; align-items: center; }
    #notifyBell { cursor: pointer; position: relative; font-size: 22px; transition: 0.2s; }
    #notifyBell:hover { transform: scale(1.1); }
    #notifyCount {
      position: absolute; top: -5px; right: -8px; background: var(--admin-red);
      color: white; border-radius: 50%; padding: 1px 6px; font-size: 10px;
      font-weight: bold; border: 1px solid white; display: none;
    }
    #notifyPopup {
      display: none; position: absolute; right: 0; top: 45px;
      width: 280px; background: #0a0a0a; border: 2px solid var(--nfs-yellow);
      z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .notify-header { padding: 10px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 11px; font-weight: bold; color: var(--nfs-yellow); text-transform: uppercase; }
    .notify-item { padding: 12px; border-bottom: 1px solid #222; }
    .notify-btns { display: flex; gap: 5px; margin-top: 8px; }
    .btn-acc { flex: 1; background: var(--nfs-yellow); border: none; padding: 5px; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; }
    .btn-rej { flex: 1; background: #333; color: white; border: none; padding: 5px; cursor: pointer; font-size: 10px; text-transform: uppercase; }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      transition: 0.3s;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(241, 196, 15, 0.1);
    }

    /* САЙДБАР */
    .main-sidebar {
      width: 250px; background: var(--nfs-dark); height: calc(100vh - 90px); position: fixed; top: 90px; border-right: 2px solid #333; z-index: 900;
    }
    .nav-item { display: block; padding: 20px 30px; color: #bbb; text-decoration: none; text-transform: uppercase; transition: 0.3s; font-size: 0.85rem; }

    /* КОНТЕЙНЕР ЧАТА */
    .app-container { display: flex; height: calc(100vh - 90px); margin-top: 90px; margin-left: 250px; }

    .chat-list { width: 320px; background: rgba(10, 10, 10, 0.95); border-right: 1px solid var(--nfs-border); overflow-y: auto; }
    .chat-category { padding: 20px 20px 10px; font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

    .chat-item {
      padding: 18px 20px;
      border-bottom: 1px solid #1a1a1a;
      display: flex; align-items: center; gap: 15px;
      cursor: pointer; transition: 0.2s; position: relative;
    }

    .chat-item:hover { background: rgba(241, 196, 15, 0.05); }
    .chat-item.active { border-left: 4px solid var(--nfs-yellow); background: rgba(255,255,255,0.05); }

    .unread-badge {
      background: var(--nfs-yellow); color: #000;
      min-width: 18px; height: 18px; padding: 2px;
      border-radius: 10px; font-size: 0.7rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    }

    /* СТАТУСЫ */
    .avatar-wrapper {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      background: #222;
    : 50%; display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--nfs-yellow);
      border: 1px solid #333;
      overflow: hidden;
    }

    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .mini-avatar {
      width: 40px;
      height: 40px;
      border: 1px solid var(--nfs-yellow);
      object-fit: cover;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--nfs-yellow);
    }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #000; position: absolute; bottom: -2px; right: -2px; z-index: 10; }

    /* ОКНО СООБЩЕНИЙ */
    .chat-window { flex-grow: 1; background: rgba(0, 0, 0, 0.88); display: flex; flex-direction: column; }
    .chat-header { padding: 15px 30px; background: #0a0a0a; border-bottom: 1px solid var(--nfs-border); display: flex; justify-content: space-between; align-items: center; }

    .messages-area { flex-grow: 1; padding: 45px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .msg { max-width: 75%; padding: 12px 24px; border-radius: 6px; position: relative; font-size: 1.4rem; line-height: 1.4; box-shadow: 4px 4px 10px rgba(0,0,0,0.4); }
    .msg.incoming { align-self: flex-start; background: #1e1e1e; border-left: 4px solid #444; }
    .msg.outgoing { align-self: flex-end; background: #2a2a2a; border-right: 4px solid var(--nfs-yellow); }

    .msg-info {
      font-size: 1.0rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      font-weight: bold;
      gap: 8px;
    }

    .msg-info .avatar-wrapper { margin-right: 2px; }

    .chat-input-area { padding: 30px; background: #0a0a0a; display: flex; gap: 15px; border-top: 1px solid #222; }
    input[type="text"] { flex-grow: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; outline: none; }
    input[type="text"]:focus { border-color: var(--nfs-yellow); }

    .send-btn {
      background: var(--nfs-yellow);
      border: none;
      border-radius: 6px;
      padding: 0 25px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    .send-btn:hover {
      color: white;
      background-color: #c10e0e;
      transition: 0.3s;
    }

    .admin-glow { color: #ff4d4d !important; text-shadow: 0 0 10px #ff0000; font-weight: 900 !important; }
    .badge-admin { background: #ff4d4d; color: white; border: 1px solid #da0000; font-size: 0.8rem; padding: 2px 5px; border-radius: 3px; margin-left: 5px; }

    .del-btn {
      color: #666;
      font-size: 0.7rem;
      margin-left: 10px;
      cursor: pointer;
    }

    .del-btn:hover {
      color: #ff4444;
    }

    .nfs-font {
      font-family: 'Wallpoet', sans-serif !important;
    }

    .racer-link {
      color: var(--nfs-yellow);
      cursor: pointer;
      text-decoration: none;
    }

    .racer-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    #typingIndicator {
      height: 20px;
      font-size: 0.75rem;
      color: var(--nfs-yellow);
      font-style: italic;
      padding: 0 25px;
      margin-bottom: 5px;
      opacity: 0.8;
      transition: 0.3s;
    }

    .chat-item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex-grow: 1;
      margin-left: 5px;
    }

    /* ==========================================================================
   АДАПТИВНАЯ ВЕРСТКА ДЛЯ МЕССЕНДЖЕРА (ЭКРАНЫ МЕНЬШЕ 768px)
   ========================================================================== */
    @media screen and (max-width: 768px) {

      /* 1. ШАПКА И ГЛАВНОЕ МЕНЮ САЙТА */
      .top-navbar {
        height: 70px !important;
        padding: 0 15px !important;
      }

      .top-navbar div[style*="font-size: 1.8rem"] {
        font-size: 1.2rem !important;
      }

      #displayNick {
        max-width: 80px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .main-sidebar {
        position: relative !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin-top: 70px !important;
        border-right: none !important;
        border-bottom: 2px solid #333 !important;
        z-index: 999 !important;
      }

      .main-sidebar nav {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: space-around !important;
      }

      .nav-item {
        flex: 1 1 30% !important;
        min-width: 95px !important;
        padding: 12px 5px !important;
        font-size: 0.75rem !important;
        text-align: center !important;
        border-bottom: 1px solid #222 !important;
      }

      .nav-item:hover, .nav-item.active {
        border-left: none !important;
        border-bottom: 3px solid var(--nfs-yellow) !important;
      }

      /* 2. КОНТЕЙНЕР ПРИЛОЖЕНИЯ НА МОБИЛКЕ */
      .app-container {
        margin-left: 0 !important;
        margin-top: 0 !important;
        height: calc(100vh - 140px) !important; /* Высчитываем высоту за вычетом шапок */
        position: relative !important;
        width: 100% !important;
        display: block !important; /* Flex-box на мобилках ломает абсолютные перекрытия колонок */
      }

      /* СПИСОК ЧАТОВ: На мобилке изначально занимает 100% */
      .chat-list {
        width: 100% !important;
        display: block !important;
      }

      /* ОКНО СООБЩЕНИЙ: Изначально спрятано и ждет активации класса .open-chat */
      .chat-window {
        display: none !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 50 !important;
        background: #050505 !important; /* Плотный фон, чтобы сквозь чат не просвечивал список */
      }

      /* ⚡️ МАГИЯ ПЕРЕКЛЮЧЕНИЯ (РАБОТАЕТ ТОЛЬКО НА СМАРТФОНЕ) */
      .app-container.open-chat .chat-list {
        display: none !important; /* Скрываем список, когда открыли чат */
      }

      .app-container.open-chat .chat-window {
        display: flex !important; /* Показываем чат и инпут */
        flex-direction: column !important;
      }

      /* 3. ОПТИМИЗАЦИЯ ДЕТАЛЕЙ ДИАЛОГА */
      .messages-area {
        padding: 15px !important;
        gap: 12px !important;
      }

      .msg {
        max-width: 85% !important;
        padding: 10px 18px !important;
        font-size: 1.1rem !important; /* Возвращаем нормальный читаемый размер вместо огромного */
      }

      .msg-info {
        font-size: 0.85rem !important;
      }

      .chat-input-area {
        padding: 15px !important;
        gap: 10px !important;
      }

      .send-btn {
        padding: 0 15px !important;
        font-size: 0.9rem !important;
      }

      .chat-back-btn {
        display: inline-block !important; /* Стрелочка "Назад" появляется только на мобилках */
      }
    }
  </style>
</head>
<body>

<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 20px;">
    <img src="https://i.postimg.cc/KjhYnZ7S/IMG-4583.png"
         alt="NFS Logo"
         style="height: 65px; width: auto; filter: drop-shadow(2px 2px 8px #000);">

    <div style="font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 5px #000; font-style: italic; text-transform: uppercase;">
      MY MESSENGER
    </div>
  </div>

  <div class="user-area" style="display: flex; align-items: center; gap: 20px;">

    <div class="notifications-wrapper" id="notifyWrapper" style="position: relative; display: flex; align-items: center;">

      <div id="notifyBell" onclick="toggleNotifyPopup()" style="cursor: pointer; display: flex; align-items: center;">
        <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div> <span id="notifyCount">0</span>

      <div id="notifyPopup" style="display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a; border: 1px solid #333; z-index: 100; min-width: 200px; margin-top: 10px;">
        <div class="notify-header" style="padding: 10px; color: #fff; border-bottom: 1px solid #333; font-family: sans-serif; text-transform: uppercase; font-size: 0.8rem;">Friend requests</div>
        <div id="notifyList"></div>
      </div>

    </div> <button class="btn-login" id="loginBtn" onclick="openModal()" style="display: none;">LOGIN</button>

    <div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 15px;">
    <span id="displayNick" style="font-weight: bold; cursor: pointer; color: #ffffff; text-shadow: 0 0 8px rgba(0,0,0,0.6);" onclick="window.location.href='profile.html'">
      Davenport
    </span>
      <button onclick="handleLogout()" class="nfs-font" style="background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 5px; color: #ff4444; cursor: pointer; font-size: 0.75rem; padding: 6px 12px; font-weight: bold; text-transform: uppercase;">
        EXIT
      </button>
    </div>
  </div>
</header>

<aside class="main-sidebar">
  <nav>
    <a href="index.html" class="nav-item">MAIN</a>
    <a href="forum.html" class="nav-item">FORUM</a>
    <a href="chats.html" class="nav-item active">MY CHATS</a>
    <a href="lobby.html" class="nav-item">SEARCH THE GAME</a>
    <a href="leaderboard.html" class="nav-item">LEADERBOARD</a>
    <a href="profile.html" class="nav-item">MY PROFILE</a>
  </nav>
</aside>

<div class="app-container">
  <div class="chat-list">
    <div class="chat-category">CHANNELS OF ROCKPORT</div>
    <div id="publicChatBtn" class="chat-item active" onclick="switchChat('global', 'GENERAL CHANNEL', 'public')">
      <div class="chat-avatar">G</div>
      <div class="chat-item-info">
        <div style="font-weight: bold;">GENERAL CHANNEL</div>
        <div style="font-size: 0.8rem; color: var(--nfs-yellow);">ALL RIDERS</div>
      </div>
    </div>

    <div class="chat-category">PRIVATE MESSAGES</div>
    <div id="dmListContainer"></div>
  </div>

  <div class="chat-window">
    <div class="chat-header">
      <div>Чат: <strong id="chatWithTitle" style="color: var(--nfs-yellow);">GENERAL CHANNEL</strong></div>
      <div id="chatStatus" style="font-size: 0.7rem; color: #444;">PUBLIC SESSION</div>
    </div>
    <div class="messages-area" id="msgBox"></div>

    <div id="typingIndicator"></div>

    <div class="chat-input-area nfs-font">
      <input type="text" id="chatInput" placeholder="Enter a message..." onkeydown="if(event.key==='Enter') doSendMessage()">
      <button class="send-btn nfs-font" onclick="doSendMessage()">ENTER</button>
    </div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let myProfile = null;
  let activeChatId = 'global';
  let activeChatType = 'public';
  let targetUserName = '';
  let specialUsers = {};
  let typingTimeout = null;
  let typingChannel = null;
  let localTypingTimeouts = {};

  window.onload = async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'auth.html'; return; }

    const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
    if (profile) {
      myProfile = profile;

      const nickEl = document.getElementById('displayNick');
      if (nickEl) {
        nickEl.innerText = myProfile.username;
      }

      if (typeof updateFriendNotifications === 'function') {
        updateFriendNotifications();
      }

      // 1. Запускаем основной маяк
      if (typeof initGlobalStatus === 'function') {
        initGlobalStatus(_supabase, myProfile);

        // 2. ПРИНУДИТЕЛЬНЫЙ ПИНГ
        setTimeout(() => {
          if (typeof window.trackMyStatus === 'function') {
            window.trackMyStatus(myProfile.status || 'ONLINE');
            console.log("Радар: принудительно вещаю статус 'В ЧАТЕ'");
          }
        }, 800);
      }

      // Обновляем бейдж сообщений
      if (typeof updateGlobalMsgBadge === 'function') {
        updateGlobalMsgBadge(_supabase, myProfile.id);
      }
    }

    await fetchSpecialRoles();
    await loadRecentDMs();

    const urlParams = new URLSearchParams(window.location.search);
    const targetName = urlParams.get('to');

    if (targetName) {
      openChatFromURL(targetName);
    } else {
      await loadMessages();
    }

    subscribeToChanges();
    initTypingTracker();
  };

  // ФУНКЦИИ РАБОТЫ СО СТАТУСАМИ

  function initStatusTracker() {
    const statusChannel = _supabase.channel('global-online', {
      config: { presence: { key: myProfile.username } }
    });

    statusChannel
      .on('presence', { event: 'sync' }, () => {
        onlineUsers = statusChannel.presenceState();
        loadRecentDMs(); // Перерисовываем список чатов с актуальными точками
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await statusChannel.track({
            user: myProfile.username,
            location: 'chats.html',
            online: true
          });
        }
      });
  }

  function getStatusColor(username, statusFromDb) {
    const presence = (typeof onlineUsers !== 'undefined') ? onlineUsers[username] : null;
    if (!presence) return '#555';

    const pData = presence[0];
    const userLocation = pData.location;
    const liveStatus = pData.status || 'ONLINE';

    if (userLocation === 'chats.html') return '#ff4d4d'; // Красный
    if (liveStatus === 'IN-GAME' || liveStatus === 'LOOKING FOR GAME') return 'var(--nfs-yellow)';

    return '#2ecc71'; // Зеленый
  }

  // ФУНКЦИИ ЧАТА

  async function fetchSpecialRoles() {
    const { data } = await _supabase.from('profiles').select('id, username, is_admin, is_vip, avatar_url, status');
    if (data) data.forEach(u => specialUsers[u.username] = {
      id: u.id, admin: u.is_admin, vip: u.is_vip, avatar: u.avatar_url, status: u.status || 'OFFLINE', username: u.username
    });
  }

  let isDMsLoading = false; // Флаг защиты от спама запросами

  async function loadRecentDMs() {
    if (!myProfile) return;

    const container = document.getElementById('dmListContainer');
    if (!container) return;

    try {
      const { data, error } = await _supabase.from('direct_messages')
        .select('*')
        .or(`sender_id.eq.${myProfile.id},receiver_id.eq.${myProfile.id}`)
        .order('created_at', {ascending: false});

      if (error) throw error;

      const contacts = new Map();
      if (data) {
        data.forEach(m => {
          const otherId = (m.sender_id === myProfile.id) ? m.receiver_id : m.sender_id;
          const otherName = (m.sender_id === myProfile.id) ? m.receiver_name : m.sender_name;

          if (otherId && otherId !== myProfile.id) {
            // 1. Если этого человека ещё нет в списке, создаём его структуру
            if (!contacts.has(otherId)) {
              const uData = specialUsers[otherName] || { avatar: null, status: 'OFFLINE' };
              contacts.set(otherId, {
                name: otherName,
                avatar: uData.avatar,
                status: uData.status,
                lastMsg: m.text,
                unreadCount: 0
              });
            }

            // 2. Счётчик непрочитанных (работает для ЛЮБОГО сообщения в цикле)
            // Если получатель — я, и сообщение не прочитано, и этот чат сейчас НЕ открыт прямо на экране
            if (m.receiver_id === myProfile.id && m.is_read === false && activeChatId !== otherId) {
              contacts.get(otherId).unreadCount++;
            }
          }
        });
      }

      container.innerHTML = contacts.size > 0 ? '' : '<p style="padding: 20px; font-size: 0.8rem; color: #444;">Нет активных диалогов</p>';

      contacts.forEach((val, id) => {
        // ОПРЕДЕЛЯЕМ ЦВЕТ ТОЧКИ В РЕАЛЬНОМ ВРЕМЕНИ ЧЕРЕЗ РАДАР
        const presence = (typeof onlineUsers !== 'undefined') ? onlineUsers[val.name] : null;

        let dotColor = '#555'; // Offline
        if (presence) {
          const pData = presence[0];
          const loc = pData.location;
          const liveStatus = pData.status || 'ONLINE';

          if (loc === 'chats.html') {
            dotColor = '#ff4d4d'; // В чате (Красный)
          } else if (liveStatus === 'IN GAME' || liveStatus === 'LOOKING FOR GAME') {
            dotColor = 'var(--nfs-yellow)'; // В игре (Желтый)
          } else {
            dotColor = '#2ecc71'; // В сети (Зеленый)
          }
        }

        container.innerHTML += `
      <div class="chat-item ${activeChatId === id ? 'active' : ''}" onclick="switchChat('${id}', '${val.name}', 'private')">
        <div class="avatar-wrapper">
          <div class="chat-avatar">${val.avatar ? `<img src="${val.avatar}">` : val.name[0]}</div>
          <div class="status-dot" style="background: ${dotColor}; ${presence ? 'box-shadow: 0 0 5px ' + dotColor : ''}"></div>
        </div>
        <div class="chat-item-info">
          <div style="font-weight: bold; color: ${presence ? '#fff' : '#888'}">${val.name}</div>
          <div style="font-size: 0.75rem; color: #666;">${val.lastMsg.substring(0, 20)}${val.lastMsg.length > 20 ? '...' : ''}</div>
        </div>

        ${val.unreadCount > 0 ? `<div class="unread-badge">${val.unreadCount}</div>` : ''}
      </div>`;
      });
    } catch (err) {
      console.error("Error of uploading DMs:", err);
    }
  }

  async function switchChat(id, name, type) {
    activeChatId = id; activeChatType = type; targetUserName = name;
    document.getElementById('chatWithTitle').innerText = name;
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));

    if(type === 'private') {
      const el = document.getElementById(`chat-${id}`);
      if (el) el.classList.add('active');
      await _supabase.from('direct_messages').update({ is_read: true }).eq('sender_id', id).eq('receiver_id', myProfile.id);
    } else {
      document.getElementById('publicChatBtn').classList.add('active');
    }

    if (typingChannel) typingChannel.unsubscribe();
    initTypingTracker();
    await loadMessages();
    await loadRecentDMs();
  }

  async function loadMessages() {
    const box = document.getElementById('msgBox'); box.innerHTML = '';
    let query = activeChatType === 'public'
      ? _supabase.from('messages').select('*').eq('room_id', 'global')
      : _supabase.from('direct_messages').select('*').or(`and(sender_id.eq.${myProfile.id},receiver_id.eq.${activeChatId}),and(sender_id.eq.${activeChatId},receiver_id.eq.${myProfile.id})`);

    const { data } = await query.order('created_at', {ascending: true});
    if (data) data.forEach(m => renderSingleMessage(m));
  }

  function renderSingleMessage(msg) {
    const box = document.getElementById('msgBox');
    if (!box || document.getElementById(`msg-${msg.id}`)) return;

    const sender = msg.sender_name;
    const isMine = (msg.sender_id === myProfile.id) || (sender === myProfile.username);
    const userData = specialUsers[sender] || { admin: false, avatar: null, status: 'OFFLINE' };
    const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    let color = getStatusColor(sender, userData.status);
    let adminTools = (myProfile.is_admin) ? `<span class="del-btn" onclick="deleteMessage('${msg.id}', '${activeChatType}')">[X]</span>` : "";

    const avatarHTML = userData.avatar ? `<img src="${userData.avatar}" class="mini-avatar">` : `<div class="mini-avatar">${sender[0].toUpperCase()}</div>`;

    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${isMine ? 'outgoing' : 'incoming'}`;
    msgDiv.id = `msg-${msg.id}`;
    msgDiv.innerHTML = `
      <div class="msg-info">
        <div class="avatar-wrapper" onclick="window.location.href='profile.html?u=${sender}'">
          ${avatarHTML}
          <div class="status-dot" style="background: ${color};"></div>
        </div>
        <span class="racer-link ${userData.admin ? 'admin-glow' : ''}" onclick="window.location.href='profile.html?u=${sender}'">${sender}</span>
        ${userData.admin ? '<span class="badge-admin">ADM</span>' : ''} • ${time} ${adminTools}
      </div>
      <div class="msg-text">${msg.text}</div>`;
    box.appendChild(msgDiv);
    box.scrollTop = box.scrollHeight;
  }

  // ТРЕКЕР ПЕЧАТИ (Broadcast)

  function initTypingTracker() {
    const channelKey = activeChatType === 'public' ? 'global' : [myProfile.id, activeChatId].sort().join('-');
    typingChannel = _supabase.channel(`typing:${channelKey}`);

    typingChannel
      .on('broadcast', {event: 'typing'}, (payload) => {
        const userName = payload.payload.user;
        if (userName === myProfile.username) return;

        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.innerText = userName + " печатает...";

        clearTimeout(localTypingTimeouts[userName]);
        localTypingTimeouts[userName] = setTimeout(() => {
          if (indicator) indicator.innerText = "";
        }, 2500);
      })
      .subscribe();

    const chatInput = document.getElementById('chatInput');
    if (chatInput) {
      chatInput.oninput = () => {
        typingChannel.send({
          type: 'broadcast',
          event: 'typing',
          payload: {user: myProfile.username}
        });
      };
    }
  }

  // ОТПРАВКА И УДАЛЕНИЕ

  async function doSendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();

    if (!text) return;

    // 1. Проверка на лимит символов (то, что мы делали раньше)
    if (text.length > 500) {
      nfsNotify('THE MESSAGE IS TOO LONG!', 'error');
      return;
    }

    // 2. ПРОВЕРКА НА МУТ (БАН)
    if (myProfile && myProfile.muted_until) {
      const now = new Date();
      const muteDate = new Date(myProfile.muted_until);

      if (muteDate > now) {
        // Считаем минуты до конца
        const diffMins = Math.ceil((muteDate - now) / 60000);

        // Используем стильный SweetAlert2 вместо обычного alert
        Swal.fire({
          title: 'OOOPS!',
          html: `Your access to the chat is blocked.<br>Mute expires in: <b style="color:#f1c40f">${diffMins} min.</b>`,
          icon: 'error',
          background: '#0a0a0a',
          color: '#fff',
          confirmButtonColor: '#f1c40f',
          confirmButtonText: 'I GOT IT'
        });
        return; // Прерываем отправку
      }
    }

    // 3. ОТПРАВКА СООБЩЕНИЯ
    let table = activeChatType === 'public' ? 'messages' : 'direct_messages';
    let payload = activeChatType === 'public'
      ? { sender_name: myProfile.username, text: text, room_id: 'global' }
      : {
        sender_id: myProfile.id,
        receiver_id: activeChatId,
        sender_name: myProfile.username,
        receiver_name: targetUserName,
        text: text
      };

    const { data, error } = await _supabase.from(table).insert([payload]).select();

    if (!error && data) {
      renderSingleMessage(data[0]);
      input.value = '';

      // Если это приватный чат, обновляем список контактов слева
      if (activeChatType === 'private') {
        loadRecentDMs();
      }
    } else if (error) {
      console.error("Sending error:", error);
      nfsNotify('Server connection error', 'error');
    }
  }

  async function deleteMessage(id, type) {
    const table = (type === 'public') ? 'messages' : 'direct_messages';
    await _supabase.from(table).delete().eq('id', id);
    document.getElementById(`msg-${id}`)?.remove();
  }

  function subscribeToChanges() {
    _supabase.channel('msgs').on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'messages'}, p => {
      if (activeChatType === 'public') renderSingleMessage(p.new);
    }).subscribe();

    _supabase.channel('dms').on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'direct_messages'}, async (p) => {
      if (p.new.receiver_id === myProfile.id || p.new.sender_id === myProfile.id) {

        // 1. ЕСЛИ МЫ СЕЙЧАС В ДИАЛОГЕ С ЭТИМ ОТПРАВИТЕЛЕМ:
        if (activeChatType === 'private' && (p.new.sender_id === activeChatId || p.new.sender_id === myProfile.id)) {
          renderSingleMessage(p.new);

          // Помечаем как прочитанное и ЖДЁМ ответа от базы данных (await)
          if (p.new.sender_id === activeChatId) {
            await _supabase.from('direct_messages')
              .update({ is_read: true })
              .eq('id', p.new.id);
          }
        }

        // 2. Жёстко обновляем список контактов слева ТОЛЬКО после того, как статус прочитанного обновился
        await loadRecentDMs();

        // 3. Синхронизируем главный счётчик MESSENGER [0] в сайдбаре
        if (typeof updateGlobalMsgBadge === 'function') {
          updateGlobalMsgBadge(_supabase, myProfile.id);
        }
      }
    }).subscribe();
  }

  async function updateFriendNotifications() {
    if (!myProfile) return;
    const { data: requests } = await _supabase.from('friend_requests')
      .select('*')
      .eq('receiver_id', myProfile.id)
      .eq('status', 'pending');

    const countEl = document.getElementById('notifyCount');
    const listEl = document.getElementById('notifyList');

    if (requests && requests.length > 0) {
      countEl.innerText = requests.length;
      countEl.style.display = 'flex'; // Показываем и центрируем цифру
      listEl.innerHTML = '';
      requests.forEach(req => {
        listEl.innerHTML += `
          <div class="notify-item" style="padding:10px; border-bottom:1px solid #222; color:#fff; font-size:0.8rem;">
            <b>${req.sender_name}</b> wants to be friends
            <div class="notify-btns" style="display:flex; gap:5px; margin-top:5px;">
              <button class="btn-acc" onclick="respondFriend('${req.id}', 'accepted')" style="flex:1; background:#f1c40f; border:none; cursor:pointer; font-weight:bold; font-size:10px;">OK</button>
              <button class="btn-rej" onclick="respondFriend('${req.id}', 'rejected')" style="flex:1; background:#333; color:#fff; border:none; cursor:pointer; font-size:10px;">NO</button>
            </div>
          </div>`;
      });
    } else {
      countEl.style.display = 'none';
      listEl.innerHTML = '<div style="padding:10px; font-size:10px; color:#444; text-align:center;">There are no requests</div>';
    }
  }

  async function respondFriend(reqId, status) {
    if (status === 'accepted') {
      await _supabase.from('friend_requests').update({ status: 'accepted' }).eq('id', reqId);
    } else {
      await _supabase.from('friend_requests').delete().eq('id', reqId);
    }
    updateFriendNotifications();
  }

  // Функция автоматического открытия чата по URL-параметру (?to=nickname)
  async function openChatFromURL(targetName) {
    if (!targetName) return;
    console.log('Перехват сигнала! Пытаемся открыть чат с:', targetName);

    // Ждем небольшую паузу, чтобы объект specialUsers точно успел заполниться данными из базы
    if (Object.keys(specialUsers).length === 0) {
      await fetchSpecialRoles();
    }

    // Ищем гонщика в нашем списке пользователей по его никнейму
    const racer = specialUsers[targetName];

    if (racer) {
      console.log(`Нашли гонщика ${targetName} с ID: ${racer.id}. Переключаю сессию...`);
      // Вызываем нашу рабочую функцию переключения чата
      switchChat(racer.id, racer.username, 'private');
    } else {
      console.warn(`[Радар]: Гонщик с ником "${targetName}" не найден в локальной базе.`);
      // Если в кэше specialUsers его вдруг нет, делаем точечный запрос в Supabase для подстраховки
      const { data } = await _supabase.from('profiles').select('id, username').eq('username', targetName).maybeSingle();
      if (data) {
        switchChat(data.id, data.username, 'private');
      } else {
        if (typeof nfsNotify === 'function') nfsNotify('RACER NOT FOUND', 'error');
      }
    }
  }

  function toggleNotifyPopup() {
    const p = document.getElementById('notifyPopup');
    if (p) p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  async function handleLogout() {
    if (myProfile) await _supabase.from('profiles').update({status: 'OFFLINE'}).eq('id', myProfile.id);
    await _supabase.auth.signOut();
    window.location.href = 'auth.html';
  }

  window.updateFriendsStatusOnly = function() {
    console.log("Радар обновился, перерисовываю список чатов...");
    loadRecentDMs();
  };
</script>
