<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | Race</title>

  <link rel="icon" href="https://i.postimg.cc/htQQdS85/IMG-3707.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>
  <style>

    :root {
      --nfs-yellow: #f1c40f;
      --nfs-bg: url('https://i.postimg.cc/7hn83fwx/875151-1023x669-Need-For-Speed-Most-Wanted-Wallpaper.jpg');
      --nfs-dark: rgba(10, 10, 10, 0.95);
      --admin-red: #e74c3c;
    }

    body {
      margin: 0; background: var(--nfs-bg) no-repeat center center fixed;
      background-size: cover; color: #fff;
      font-family: 'Wallpoet', sans-serif !important;
      overflow-x: hidden;
    }

    #displayNick:hover {
      text-decoration: underline;
    }

    /* Применяем гоночный шрифт к списку уведомлений и кнопкам внутри */
    #notifyPopup,
    .notify-item,
    .btn-acc,
    .btn-rej {
      font-family: 'Wallpoet', sans-serif !important;
    }

    .btn-exit:hover {
      background: rgba(255, 68, 68, 0.2) !important;
      color: #ff6666 !important;
      border-color: #ff4444 !important;
    }

    /* УВЕДОМЛЕНИЯ */
    .notifications-wrapper { position: relative; margin-right: 20px; display: flex; align-items: center; }
    #notifyBell { cursor: pointer; position: relative; font-size: 22px; transition: 0.2s; }
    #notifyBell:hover { transform: scale(1.1); }
    #notifyCount {
      position: absolute; top: -5px; right: -8px; background: var(--admin-red);
      color: white; border-radius: 50%; padding: 1px 6px; font-size: 10px;
      font-weight: bold; border: 1px solid white; display: none;
    }
    #notifyPopup {
      display: none; position: absolute; right: 0; top: 45px;
      width: 280px; background: #0a0a0a; border: 2px solid var(--nfs-yellow);
      z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .notify-header { padding: 10px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 11px; font-weight: bold; color: var(--nfs-yellow); text-transform: uppercase; }
    .notify-item { padding: 12px; border-bottom: 1px solid #222; }
    .notify-btns { display: flex; gap: 5px; margin-top: 8px; }
    .btn-acc { flex: 1; background: var(--nfs-yellow); border: none; padding: 5px; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; }
    .btn-rej { flex: 1; background: #333; color: white; border: none; padding: 5px; cursor: pointer; font-size: 10px; text-transform: uppercase; }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      transition: 0.3s;
    }

    /* ШАПКА В ПОЛОСКУ (90px) */
    .top-navbar {
      height: 90px; position: fixed; top: 0; width: 100%; z-index: 1100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 40px; box-sizing: border-box;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
      repeating-linear-gradient(-45deg, #0a0a0a, #0a0a0a 40px, rgba(241, 196, 15, 0.4) 40px, rgba(241, 196, 15, 0.4) 80px);
      border-bottom: 2px solid var(--nfs-yellow); box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    }

    /* САЙДБАР */
    .main-sidebar {
        width: 250px;
        background: linear-gradient(
          to right,
          rgba(5, 5, 5, 0.98) 0%,
          rgba(12, 12, 12, 0.95) 60%,
          rgba(20, 20, 20, 0.85) 100%
        );
        backdrop-filter: blur(4px);
        height: auto;
        position: fixed;
        top: 70px;
        left: 0;
        border-right: 2px solid var(--nfs-border);
        padding-top: 20px;
        z-index: 999;
      }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.3s;
      font-size: 0.85rem;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(241,196,15,0.1);
    }

    .content {
      margin-left: 250px;
      min-height: 100vh;
      padding-top: 90px;
    }

    /* HERO СЕКЦИЯ С КАРТИНКОЙ */
    .lobby-hero {
      width: 100%; height: 300px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.9)),
      url('https://images7.alphacoders.com/517/thumb-1920-517466.jpg');
      background-size: cover; background-position: center;
      border-bottom: 4px solid var(--nfs-yellow);
      display: flex; align-items: flex-end; padding: 40px; box-sizing: border-box;
      position: relative;
    }
    .lobby-hero::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
    }

    .lobby-grid-container { padding: 40px; }

    .create-btn {
      background: var(--nfs-yellow);
      color: #000000;
      border: none;
      padding: 12px 25px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .create-btn:hover {
      color: white;
      background-color: #c10e0e;
    }

    .nfs-font {
      font-family: 'Wallpoet', sans-serif !important;
    }

    .lobby-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .lobby-card {
      background: var(--nfs-dark);
      padding: 25px;
      position: relative;
    }

    .lobby-status { font-size: 0.65rem; text-transform: uppercase; color: var(--nfs-yellow); letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }
    .lobby-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 10px; font-style: italic; text-transform: uppercase; }

    .player-dots { display: flex; gap: 6px; margin: 15px 0; }
    .dot { width: 14px; height: 14px; border: 1px solid #444; background: #222; }
    .dot.filled { background: var(--nfs-yellow); border-color: var(--nfs-yellow); box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }

    .join-btn {
      width: 100%; padding: 12px; background: none; border: 1px solid var(--nfs-yellow);
      color: var(--nfs-yellow); font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s;
    }
    .join-btn:hover { background: var(--nfs-yellow); color: #000; }

    /* МОДАЛКА ЛОББИ */
    #activeLobbyModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); z-index: 2000; align-items: center; justify-content: center;
    }
    .lobby-window {
      width: 900px; background: #0a0a0a; border: 2px solid var(--nfs-yellow);
      display: flex; height: 550px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }
    .lobby-players-side { width: 320px; border-right: 1px solid #222; padding: 30px; display: flex; flex-direction: column; }
    .lobby-chat-side { flex-grow: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.01); }

    .player-row {
      display: flex; align-items: center; gap: 12px; background: #151515;
      padding: 12px; border-left: 3px solid var(--nfs-yellow); margin-bottom: 10px;
    }
    .player-avatar { width: 35px; height: 35px; background: #222; border-radius: 50%; overflow: hidden; border: 1px solid #333; }
    .player-avatar img { width: 100%; height: 100%; object-fit: cover; }

    #lobbyChatBox { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .lobby-msg { font-size: 0.85rem; color: #ccc; }
    .lobby-msg b { color: var(--nfs-yellow); }
    .leave-btn { margin-top: auto; padding: 12px; background: #ff4444; color: #fff; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; }
    .admin-glow { color: #ffffff !important; text-shadow: 0 0 10px #ffffff; font-weight: 900 !important; }

    /* ==========================================================================
   АДАПТИВНАЯ ВЕРСТКА ДЛЯ RACE LOBBIES (ЭКРАНЫ МЕНЬШЕ 768px)
   ========================================================================== */
    @media screen and (max-width: 768px) {

      /* 1. ШАПКА И КОМПАКТНЫЙ ЛОГОТИП */
      .top-navbar {
        height: 70px !important; /* Уменьшаем высоту шапки на мобилках до стандарта */
        padding: 0 15px !important;
        position: fixed !important;
      }

      .top-navbar img {
        height: 45px !important; /* Делаем логотип чуть аккуратнее */
      }

      .top-navbar div[style*="font-size: 1.8rem"] {
        font-size: 1.2rem !important; /* Сжимаем заголовок "Race Lobbies" */
      }

      #displayNick {
        max-width: 80px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 2. ПЕРЕНОС МЕНЮ НАВЕРХ */
      .main-sidebar {
        position: relative !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin-top: 70px !important; /* Привязываем к новой высоте шапки */
        border-right: none !important;
        border-bottom: 2px solid #333 !important;
        z-index: 999 !important;
        display: block !important;
      }

      .main-sidebar nav {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: space-around !important;
      }

      .nav-item {
        flex: 1 1 30% !important;
        min-width: 95px !important;
        padding: 12px 5px !important;
        font-size: 0.75rem !important;
        text-align: center !important;
        border-bottom: 1px solid #222 !important;
        box-sizing: border-box !important;
      }

      .nav-item:hover, .nav-item.active {
        border-left: none !important;
        border-bottom: 3px solid var(--nfs-yellow) !important;
      }

      /* 3. ОСНОВНОЙ КОНТЕНТ */
      .content {
        margin-left: 0 !important; /* Убираем десктопный сдвиг */
        padding-top: 0 !important;
        width: 100% !important;
      }

      /* Баннер "FIND YOUR CREW" */
      .lobby-hero {
        height: auto !important;
        padding: 20px 15px !important;
        padding-top: 30px !important;
      }

      .lobby-hero div[style*="display: flex"] {
        flex-direction: column !important; /* Заголовок и кнопка создают вертикальный стек */
        align-items: stretch !important;
        gap: 20px;
      }

      .lobby-hero h1 {
        font-size: 1.8rem !important; /* Сжимаем заголовок баннера */
        text-align: center;
      }

      .lobby-hero p {
        text-align: center;
      }

      .create-btn {
        width: 100% !important; /* Кнопка создания лобби на всю ширину экрана */
        text-align: center;
        box-sizing: border-box;
      }

      .lobby-grid-container {
        padding: 20px 15px 100px 15px !important; /* Мобильные отступы для сетки комнат */
      }

      .lobby-grid {
        grid-template-columns: 1fr !important; /* Карточки комнат идут строго по одной в ряд */
        gap: 15px !important;
      }

      /* 4. АДАПТАЦИЯ ОКНА ОТКРЫТОГО ЛОББИ */
      .lobby-window {
        width: 95% !important; /* Окно займет почти всю ширину экрана */
        height: 85vh !important; /* Ограничиваем по высоте экрана телефона */
        flex-direction: column !important; /* Разворачиваем: игроки сверху, чат снизу */
      }

      .lobby-players-side {
        width: 100% !important;
        height: 40% !important; /* Игроки занимают верхнюю часть */
        border-right: none !important;
        border-bottom: 1px solid #222 !important;
        padding: 15px !important;
        box-sizing: border-box;
      }

      #playerSlotContainer {
        margin-top: 10px !important;
        display: flex !important;
        gap: 10px;
        overflow-x: auto; /* Если игроков много, их можно скроллить горизонтально */
        padding-bottom: 5px;
      }

      .player-row {
        margin-bottom: 0 !important;
        padding: 6px 10px !important;
        flex-shrink: 0; /* Не даем карточкам игроков сжиматься в кашу */
      }

      .lobby-chat-side {
        height: 60% !important; /* Чат занимает нижнюю часть */
      }

      #lobbyChatBox {
        padding: 15px !important;
      }

      .leave-btn {
        padding: 8px !important;
        font-size: 0.8rem !important;
      }

      /* Исправление для нижнего инпута в чате лобби */
      .lobby-chat-side div[style*="padding:20px"] {
        padding: 10px !important;
        gap: 5px !important;
      }
    }
  </style>
</head>
<body>

<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 20px;">
    <img src="https://i.postimg.cc/KjhYnZ7S/IMG-4583.png" alt="NFS Logo" style="height: 65px; width: auto; filter: drop-shadow(2px 2px 8px #000);">
    <div style="font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 5px #000; font-style: italic; text-transform: uppercase;">
      Race Lobbies
    </div>
  </div>

  <div class="user-area" style="display: flex; align-items: center; gap: 20px;">

    <div class="notifications-wrapper" id="notifyWrapper" style="position: relative; display: flex; align-items: center;">

      <div id="notifyBell" onclick="toggleNotifyPopup()" style="cursor: pointer; display: flex; align-items: center;">
        <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notifyCount" style="margin-left: 5px;">0</span>
      </div>

      <div id="notifyPopup" style="display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a; border: 1px solid #333; z-index: 100; min-width: 200px; margin-top: 10px;">
        <div class="notify-header nfs-font" style="padding: 10px; color: #fff; border-bottom: 1px solid #333; font-family: sans-serif; text-transform: uppercase; font-size: 0.8rem;">Friend requests</div>
        <div id="notifyList"></div>
      </div>

    </div> <button class="btn-login" id="loginBtn" onclick="openModal()" style="display: none;">LOGIN</button>

    <div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 15px;">
    <span id="displayNick" style="font-weight: bold; cursor: pointer; color: #ffffff; text-shadow: 0 0 8px rgba(0,0,0,0.6);" onclick="window.location.href='profile.html'">
      Davenport
    </span>
      <button onclick="handleLogout()" class="nfs-font btn-exit"
              style="background: rgba(0,0,0,0.6);
              border: 1px solid #333;
              border-radius: 5px;
              color: #ff4444;
              cursor: pointer;
              font-size: 0.75rem;
              padding: 6px 12px;
              font-weight: bold;
              text-transform: uppercase;">
        EXIT
      </button>
    </div>
  </div>
</header>

<aside class="main-sidebar">
  <nav>
    <a href="index.html" class="nav-item">Main</a>
    <a href="forum.html" class="nav-item">Forum</a>
    <a href="chats.html" class="nav-item">Messenger</a>
    <a href="lobby.html" class="nav-item active">Search the game</a>
    <a href="leaderboard.html" class="nav-item">Leaderboard</a>
    <a href="profile.html" class="nav-item">My profile</a>
  </nav>
</aside>

<div class="content">
  <div class="lobby-hero">
    <div style="position: relative; z-index: 10; width: 100%; display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 style="margin:0; font-style: italic; text-transform: uppercase; font-size: 3rem; text-shadow: 4px 4px 0 #000;">FIND YOUR CREW</h1>
        <p style="color: var(--nfs-yellow); font-size: 0.9rem; font-weight: bold; letter-spacing: 2px; text-shadow: 2px 2px 4px #000;">ASSEMBLE A TEAM TO GO TO GAMERANGER</p>
      </div>
      <button class="create-btn nfs-font"
              style="border-radius: 6px"
              onclick="createLobby()">+ CREATE LOBBY</button>
    </div>
  </div>

  <div class="lobby-grid-container">
    <div id="lobbyList" class="lobby-grid"></div>
  </div>
</div>

<div id="activeLobbyModal">
  <div class="lobby-window">
    <div class="lobby-players-side">
      <h2 id="modalLobbyTitle" style="margin:0; font-style:italic; text-transform:uppercase;">Lobby Name</h2>
      <div id="playerSlotContainer" style="margin-top:25px;"></div>
      <button class="leave-btn" onclick="leaveLobby()">Leave this room</button>
    </div>
    <div class="lobby-chat-side">
      <div id="lobbyChatBox">
        <div class="lobby-msg"><i>System: Welcome to the room. Wait for all the riders to be ready!</i></div>
      </div>
      <div style="padding:20px; border-top:1px solid #222; display:flex; gap:10px;">
        <input type="text" id="lobbyChatInput" placeholder="Write to the Team..." style="flex-grow:1; background:#111; border:1px solid #333; color:#fff; padding:12px; outline:none;" onkeydown="if(event.key==='Enter') sendLobbyMsg()">
        <button class="create-btn" style="padding:0 20px;" onclick="sendLobbyMsg()">ОК</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let myProfile = null;
  let currentLobbyId = null;

  window.onload = async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'auth.html'; return; }

    const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();

    if (profile) {
      myProfile = profile;

      const nickDisplay = document.getElementById('displayNick');
      if (nickDisplay) {
        nickDisplay.innerText = myProfile.username;
        if (myProfile.is_admin) nickDisplay.classList.add('admin-glow');
      }

      if (typeof updateFriendNotifications === 'function') {
        updateFriendNotifications();
      }

      if (typeof initGlobalStatus === 'function') {
        initGlobalStatus(_supabase, profile);
      }
      if (typeof updateGlobalMsgBadge === 'function') {
        updateGlobalMsgBadge(_supabase, profile.id);
      }
    }

    loadLobbies();
    subscribeToUpdates();
  };


  async function loadLobbies() {
    const { data } = await _supabase.from('lobbies').select('*').order('created_at', {ascending: false});
    const container = document.getElementById('lobbyList');
    container.innerHTML = '';
    if (data && data.length > 0) {
      data.forEach(lobby => {
        let dots = '';
        for(let i=1; i<=4; i++) dots += `<div class="dot ${i <= lobby.current_players ? 'filled' : ''}"></div>`;
        container.innerHTML += `<div class="lobby-card"><div class="lobby-status">${lobby.status}</div><div class="lobby-title">${lobby.title}</div><div style="font-size: 0.8rem; color: #777; margin-bottom: 10px;">ORGANIZER: ${lobby.host_name}</div><div class="player-dots">${dots}</div><button class="join-btn" onclick="joinLobby('${lobby.id}')">${lobby.current_players >= 4 ? 'COMPLETE' : 'JOIN'}</button></div>`;
      });
    } else {
      container.innerHTML = '<p style="color:#f1c40f;><strong>There are no active rooms. Be the first—create a lobby!</strong></p>';
    }
  }

  async function createLobby() {
    const { value: title } = await Swal.fire({
      title: 'NAME FOR ROOM',
      input: 'text',
      inputPlaceholder: 'For exmpl: Drag Race 1v1',
      background: '#0a0a0a',
      color: '#fff',
      confirmButtonColor: '#f1c40f',
      inputAttributes: { maxlength: 25 },

      customClass: {
        popup: 'nfs-font',
        title: 'nfs-font',
        input: 'nfs-font',
        confirmButton: 'nfs-font',
        cancelButton: 'nfs-font'
      }
    });

    if (title) {
      const { data, error } = await _supabase.from('lobbies').insert([{
        host_name: myProfile.username,
        host_id: myProfile.id,
        title: title,
        current_players: 1,
        players: [{id: myProfile.id, name: myProfile.username, avatar: myProfile.avatar_url}]
      }]).select();

      if (!error && data) joinLobby(data[0].id);
    }
  }

  async function joinLobby(id) {
    const { data: lobby } = await _supabase.from('lobbies').select('*').eq('id', id).single();
    let players = lobby.players || [];
    const isAlreadyIn = players.find(p => p.id === myProfile.id);

    if (!isAlreadyIn) {
      if (lobby.current_players >= 4) {
        return Swal.fire({
          title: "ROOM FULL",
          text: "No seats left for this race!",
          icon: "error",
          background: '#0a0a0a',
          color: '#fff',
          confirmButtonColor: '#e74c3c',
          customClass: {
            popup: 'nfs-font',
            title: 'nfs-font',
            htmlContainer: 'nfs-font',
            confirmButton: 'nfs-font'
          }
        });
      }

      players.push({ id: myProfile.id, name: myProfile.username, avatar: myProfile.avatar_url });
      await _supabase.from('lobbies').update({
        players: players,
        current_players: players.length,
        status: players.length >= 4 ? 'full' : 'open'
      }).eq('id', id);
    }

    currentLobbyId = id;
    renderLobbyWindow(id);
  }

  async function renderLobbyWindow(id) {
    const { data: lobby } = await _supabase.from('lobbies').select('*').eq('id', id).single();
    if (!lobby) return;
    document.getElementById('modalLobbyTitle').innerText = lobby.title;
    document.getElementById('activeLobbyModal').style.display = 'flex';
    const container = document.getElementById('playerSlotContainer');
    container.innerHTML = '';
    lobby.players.forEach(p => {
      container.innerHTML += `<div class="player-row"><div class="player-avatar">${p.avatar ? `<img src="${p.avatar}">` : `<div style="text-align:center;line-height:35px;color:#f1c40f;">${p.name[0]}</div>`}</div><span style="font-weight:900; letter-spacing:1px;">${p.name}</span></div>`;
    });
  }

  async function leaveLobby() {
    const { data: lobby } = await _supabase.from('lobbies').select('*').eq('id', currentLobbyId).single();
    if (!lobby) return;
    let players = lobby.players.filter(p => p.id !== myProfile.id);
    if (players.length === 0) { await _supabase.from('lobbies').delete().eq('id', currentLobbyId); }
    else { await _supabase.from('lobbies').update({ players: players, current_players: players.length, host_name: players[0].name, status: 'open' }).eq('id', currentLobbyId); }
    document.getElementById('activeLobbyModal').style.display = 'none';
    currentLobbyId = null;
    loadLobbies();
  }

  function sendLobbyMsg() {
    const input = document.getElementById('lobbyChatInput');
    const text = input.value.trim();
    if (!text) return;
    const box = document.getElementById('lobbyChatBox');
    box.innerHTML += `<div class="lobby-msg"><b>${myProfile.username}:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
    input.value = '';
  }

  function toggleNotifyPopup() {
    const p = document.getElementById('notifyPopup');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  async function updateFriendNotifications() {
    if (!myProfile) return;
    const { data: requests } = await _supabase.from('friend_requests')
      .select('*')
      .eq('receiver_id', myProfile.id)
      .eq('status', 'pending');

    const countEl = document.getElementById('notifyCount');
    const listEl = document.getElementById('notifyList');

    if (requests && requests.length > 0) {
      countEl.innerText = requests.length;
      countEl.style.display = 'block';
      listEl.innerHTML = '';
      requests.forEach(req => {
        listEl.innerHTML += `
                    <div class="notify-item">
                        <b>${req.sender_name}</b> wants to be friends
                        <div class="notify-btns">
                            <button class="btn-acc" onclick="respondFriend('${req.id}', 'accepted')">ОК</button>
                            <button class="btn-rej" onclick="respondFriend('${req.id}', 'rejected')">NO</button>
                        </div>
                    </div>`;
      });
    } else {
      countEl.style.display = 'none'; // Прячем кружок, если запросов нет
      listEl.innerHTML = '<div style="padding:10px; font-size:10px; color:#444; text-align:center;">There are no requests</div>';
    }
  }

  async function respondFriend(reqId, status) {
    try {
      if (status === 'accepted') {
        await _supabase.from('friend_requests').update({ status: 'accepted' }).eq('id', reqId);
        if (typeof nfsNotify === 'function') nfsNotify('Racer added to friends!');
      } else {
        await _supabase.from('friend_requests').delete().eq('id', reqId);
        if (typeof nfsNotify === 'function') nfsNotify('Your request has been reject', 'info');
      }

      // Мгновенно обновляем интерфейс
      await updateFriendNotifications();
      await loadSidebarFriends();
    } catch (err) {
      console.error("Error when responding to a request:", err);
    }
  }

  function subscribeToUpdates() {
    _supabase.channel('lobby-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'lobbies' }, payload => {
      loadLobbies();
      if (currentLobbyId && payload.new && payload.new.id === currentLobbyId) { renderLobbyWindow(currentLobbyId); }
    }).subscribe();
  }

  async function handleLogout() { await _supabase.auth.signOut(); window.location.href = 'auth.html'; }
</script>
</body>
</html>
