<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | Topic</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root { --nfs-yellow: #f1c40f;
      --nfs-dark: #0a0a0a;
    }

    body {
      margin: 0;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
      url('https://toprating.in.ua/wp-content/uploads/2016/07/games-need_for_speed_3_most_wanted_002_1280x720.jpg')
      no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: "Garamond", "Baskerville", "Playfair Display", Georgia, serif;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px;
    }

    .main-topic {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      margin-bottom: 20px;
    }

    .comment {
      background: #151515;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #333;
    }

    .comment-meta {
      font-size: 1.2rem;
      color: var(--nfs-yellow);
      margin-bottom: 5px;
    }

    /* ОБНОВЛЕННЫЙ ТЕКСТАРЕА */
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 15px;
      margin: 20px 0;
      outline: none;
      resize: none; /* изменение размера окна для сообщений */
      box-sizing: border-box; /* Фикс ширины */
    }

    textarea:focus {
      border-color: var(--nfs-yellow);
    }

    .btn {
      background: var(--nfs-yellow);
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .btn:hover {
      background-color: #c1970e;
    }

    .btn-secondary {
      background: #333;
      color: #fff;
      margin-right: 10px;
    }

    .btn-secondary:hover {
      background-color: #252525;
    }

    .btn-danger {
      background: #ff4d4d;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc3333;
    }

    .back-link {
      color: #888;
      text-decoration: none;
      display: block;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .back-link:hover {
      color: var(--nfs-yellow);
    }

    .hidden {
      display: none !important;
    }

    .nfs-swal-popup {
      border: 2px solid var(--nfs-yellow) !important;
    }

    .racer-link {
      color: var(--nfs-yellow);
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }

    .racer-link:hover {
      color: #ff0000;
    }

    /* ==========================================================================
   АДАПТИВНАЯ ВЕРСТКА ДЛЯ СТРАНИЦЫ ТЕМЫ (ЭКРАНЫ МЕНЬШЕ 768px)
   ========================================================================== */
    @media screen and (max-width: 768px) {

      /* 1. ГЛАВНЫЙ КОНТЕЙНЕР */
      .container {
        padding: 20px 15px 60px 15px !important; /* Делаем аккуратные мобильные отступы */
        width: 100% !important;
        box-sizing: border-box;
      }

      /* Ссылка возврата на форум */
      .back-link {
        font-size: 1.1rem !important; /* Уменьшаем размер ссылки, чтобы она не занимала пол-экрана */
        margin-bottom: 15px;
      }

      /* 2. ГЛАВНЫЙ ПОСТ ТЕМЫ */
      .main-topic {
        padding: 15px !important; /* Сжимаем внутренние отступы коробки поста */
      }

      .main-topic h1 {
        font-size: 1.5rem !important; /* Уменьшаем заголовок темы */
        line-height: 1.3;
      }

      .main-topic p {
        font-size: 1.1rem !important; /* Снижаем гигантский шрифт 1.5rem до читаемого на смартфонах */
        line-height: 1.4;
      }

      .main-topic small {
        font-size: 0.9rem !important; /* Уменьшаем блок с автором */
      }

      /* 3. КНОПКИ УПРАВЛЕНИЯ ДЛЯ АВТОРА ТЕМЫ */
      #authorControls {
        padding-left: 0 !important; /* Убираем левый сдвиг */
        display: flex;
        gap: 10px;
        margin-bottom: 25px !important;
      }

      #authorControls .btn {
        flex: 1; /* Кнопки "Edit" и "Delete" делят экран поровну */
        text-align: center;
        padding: 12px 5px !important;
        font-size: 0.9rem;
      }

      /* 4. БЛОК С КОММЕНТАРИЯМИ */
      #commentsList h3 {
        font-size: 1.1rem;
        text-align: center;
      }

      .comment {
        padding: 12px !important;
      }

      .comment-meta {
        font-size: 0.9rem !important; /* Мета-данные ответа чуть компактнее */
      }

      .comment div[style*="font-size: 25px"] {
        font-style: normal;
        font-size: 1.1rem !important; /* Огромный шрифт ответов в 25px на мобилке просто разнесет верстку */
        line-height: 1.4 !important;
      }

      /* 5. ФОРМА ОТПРАВКИ ОТВЕТА */
      #replyBox h3 {
        font-size: 1.2rem;
      }

      textarea {
        padding: 10px !important;
        margin: 15px 0 !important;
        font-size: 0.95rem;
      }

      #replyBox .btn {
        width: 100%; /* Кнопка "Send" растягивается на всю ширину для удобного тапа пальцем */
        padding: 12px !important;
        text-align: center;
      }
    }

  </style>
</head>
<body>
<div class="container">
  <a href="forum.html" class="back-link">← Return to Discussion Archive</a>

  <div id="topicDetail">
    <div class="main-topic">
      <p style="color: #666;">Frequency Scanning...</p>
    </div>
  </div>

  <div id="authorControls"
       class="hidden"
       style="margin-bottom: 40px;
       padding-left: 30px;">

    <button class="btn btn-secondary"
            style="border-radius: 6px"
            onclick="editTopic()">Edit</button>

    <button class="btn btn-danger"
            style="border-radius: 6px"
            onclick="confirmDeleteTopic()">Delete topic</button>
  </div>

  <hr style="border: 0; border-top: 1px solid #333; margin: 40px 0;">

  <div id="commentsList">
    <h3>ANSWERS:</h3>
  </div>

  <div id="replyBox">
    <h3 style="color:
    var(--nfs-yellow);
    font-style: italic;">Send Reply</h3>
    <textarea id="commentText"
              rows="3"
              placeholder="Enter your message here..."></textarea>
    <button class="btn"
            style="border-radius: 6px"
            onclick="postComment()">Send</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const topicId = urlParams.get('id');

  let myName = "";
  let currentUserId = null;
  let topicData = null;

  window.onload = async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if (user) {
      currentUserId = user.id;
      const { data: prof } = await _supabase.from('profiles').select('username').eq('id', user.id).single();
      if (prof) myName = prof.username;
    } else {
      window.location.href = 'auth.html';
      return;
    }
    await loadFullTopic();
    await loadComments();
  };

  async function loadFullTopic() {
    const { data, error } = await _supabase.from('forum_topics').select('*').eq('id', topicId).single();
    if (error || !data) {
      document.getElementById('topicDetail').innerHTML = "<h2>Topic not found.</h2>";
      return;
    }
    topicData = data;
    document.getElementById('topicDetail').innerHTML = `
      <div class="main-topic">
        <h1 style="color:var(--nfs-yellow); text-transform: uppercase; font-style: italic; margin-top: 0;">${data.title}</h1>
        <p style="font-size: 1.5rem; line-height: 1.6; color: #eee;">${data.content}</p>
        <small style="
        font-size: 20px;
        color: #888;">Post author:
           <span class="racer-link" onclick="window.location.href='profile.html?u=${data.author_name}'">
             ${data.author_name}
           </span>
        </small>
      </div>
    `;
    if (currentUserId === data.author_id) {
      document.getElementById('authorControls').classList.remove('hidden');
    }
  }

  async function loadComments() {
    const { data } = await _supabase.from('forum_comments')
      .select('*')
      .eq('topic_id', topicId)
      .order('created_at', {ascending: true});

    const list = document.getElementById('commentsList');
    list.innerHTML = '<h3 style="border-bottom: 1px solid #222; padding-bottom: 10px; font-style: italic;">MESSAGE INTERCEPT:</h3>';

    if (data && data.length > 0) {
      data.forEach(c => {
        list.innerHTML += `
          <div class="comment">
            <div class="comment-meta">
               <span class="racer-link" onclick="window.location.href='profile.html?u=${c.author_name}'">
                 ${c.author_name}
               </span> • ${new Date(c.created_at).toLocaleString()}
            </div>
            <div style="color: #ddd;
            font-size: 25px;
            line-height: 1.4;">${c.content}</div>
          </div>
        `;
      });
    } else {
      list.innerHTML += '<p style="color: #cfcfcf;">It`s quiet here for now...</p>';
    }
  }

  async function postComment() {
    const text = document.getElementById('commentText').value.trim();
    if (!text) return;

    const { error } = await _supabase.from('forum_comments').insert([
      { topic_id: topicId, content: text, author_name: myName }
    ]);

    if (!error) {
      document.getElementById('commentText').value = '';
      nfsNotify("Ответ отправлен в сеть");
      loadComments();
    }
  }

  async function confirmDeleteTopic() {
    const result = await Swal.fire({
      title: 'Are you sure to delete this topic?',
      text: "This message will disappear from the archives forever!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#ff4d4d',
      confirmButtonText: 'YES I`M SURE',
      cancelButtonText: 'CANCEL',
      background: '#0a0a0a',
      color: '#fff'
    });
    if (result.isConfirmed) {
      const { error } = await _supabase.from('forum_topics').delete().eq('id', topicId);
      if (!error) {
        nfsNotify("Topic deleted");
        setTimeout(() => window.location.href = 'forum.html', 1000);
      }
    }
  }

  async function editTopic() {
    const { value: formValues } = await Swal.fire({
      title: 'EDIT THIS TOPIC',
      background: '#0a0a0a',
      color: '#fff',
      html:
        `<input id="swal-title" class="swal2-input" placeholder="Title" value="${topicData.title}" style="background:#111; color:#fff; border:1px solid #444">` +
        `<textarea id="swal-content" class="swal2-textarea" placeholder="Content" style="background:#111; color:#fff; border:1px solid #444; height: 150px;">${topicData.content}</textarea>`,
      confirmButtonText: 'SAVE CHANGES',
      confirmButtonColor: '#f1c40f',
      preConfirm: () => {
        return {
          title: document.getElementById('swal-title').value.trim(),
          content: document.getElementById('swal-content').value.trim()
        }
      }
    });
    if (formValues) {
      const { error } = await _supabase.from('forum_topics')
        .update({ title: formValues.title, content: formValues.content })
        .eq('id', topicId);
      if (!error) {
        nfsNotify("Data updated");
        loadFullTopic();
      }
    }
  }
</script>
</body>
</html>
