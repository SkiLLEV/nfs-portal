<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFS Portal | Topic</title>

  <link rel="icon" href="https://i.postimg.cc/htQQdS85/IMG-3707.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root {
      --nfs-yellow: #cca609; /* Привели к единому приглушенному золотому тону */
      --nfs-dark: #0a0a0a;
    }

    body {
      margin: 0; padding: 0;
      background: url('https://s748.ucoz.net/.s/t/984/1.gif') #191919 repeat;
      /*background: var(--nfs-bg) no-repeat center center fixed;*/
      /*background-size: cover;*/
      color: #fff;
      font-family: 'Wallpoet', sans-serif !important;
      padding-bottom: 60px; /* Отступ под футер */
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 40px 40px 40px;

    .main-topic {
      background: rgba(15, 15, 15, 0.95);
      padding: 30px;
      margin-bottom: 20px;
      border: 1px solid #222;
    }

    .main-topic p, .comment div {
      white-space: pre-line;
    }

    .comment {
      background: #111;
      padding: 20px;
      margin-bottom: 10px;
      border: 1px solid #222;
    }

    .user-text-content {
      font-family: 'Arial', 'Helvetica', sans-serif !important;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e0e0e0;
      letter-spacing: 0.5px;
    }

    .comment-meta {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 10px;
      font-family: 'Wallpoet', sans-serif;
      text-transform: uppercase;
    }

    /* ОБНОВЛЕННЫЙ ТЕКСТАРЕА */
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 15px;
      margin: 20px 0;
      outline: none;
      resize: none;
      box-sizing: border-box;
      font-family: 'Arial', 'Helvetica', sans-serif !important; /* Удобный ввод */
      font-size: 1rem;
    }

    textarea:focus {
      border-color: var(--nfs-yellow);
    }

    .btn {
      background: var(--nfs-yellow);
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
      color: #000;
    }

    .btn:hover {
      color: white;
      background-color: #c10e0e;
    }

    .nfs-font {
      font-family: 'Wallpoet', sans-serif !important;
    }

    .btn-secondary {
      background: #333;
      color: #fff;
      margin-right: 10px;
    }

    .btn-secondary:hover {
      background-color: #252525;
    }

    .btn-danger {
      background: #ff4d4d;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc3333;
    }

    .back-link {
      color: #888;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.2s;
    }

    .back-link:hover {
      color: var(--nfs-yellow);
    }

    .hidden {
      display: none !important;
    }

    .nfs-swal-popup {
      border: 2px solid var(--nfs-yellow) !important;
    }

    .racer-link {
      color: var(--nfs-yellow);
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
    }

    .racer-link:hover {
      color: #ff0000;
      text-decoration: underline;
    }

    /* ==========================================================================
   АДАПТИВНАЯ ВЕРСТКА ДЛЯ СТРАНИЦЫ ТЕМЫ (ЭКРАНЫ МЕНЬШЕ 768px)
   ========================================================================== */
    @media screen and (max-width: 768px) {
      .container {
        padding: 20px 15px 60px 15px !important;
        width: 100% !important;
        box-sizing: border-box;
      }

      .back-link {
        font-size: 0.9rem !important;
        margin-bottom: 15px;
      }

      .main-topic {
        padding: 15px !important;
      }

      .main-topic h1 {
        font-size: 1.5rem !important;
        line-height: 1.3;
      }

      .user-text-content {
        font-size: 0.95rem !important;
        line-height: 1.5;
      }

      .main-topic small {
        font-size: 0.9rem !important;
      }

      #authorControls {
        padding-left: 0 !important;
        display: flex;
        gap: 10px;
        margin-bottom: 25px !important;
      }

      #authorControls .btn {
        flex: 1;
        text-align: center;
        padding: 12px 5px !important;
        font-size: 0.9rem;
      }

      #commentsList h3 {
        font-size: 1.1rem;
        text-align: center;
      }

      .comment {
        padding: 12px !important;
      }

      .comment-meta {
        font-size: 0.8rem !important;
      }

      #replyBox h3 {
        font-size: 1.2rem;
      }

      textarea {
        padding: 10px !important;
        margin: 15px 0 !important;
        font-size: 0.95rem;
      }

      #replyBox .btn {
        width: 100%;
        padding: 12px !important;
        text-align: center;
      }

    }
    }
  </style>
</head>
<body>
<div class="container">
  <a href="forum.html" class="back-link">← Return to Discussion Archive</a>

  <div id="topicDetail">
    <div class="main-topic">
      <p style="color: #666;">Frequency Scanning...</p>
    </div>
  </div>

  <div id="authorControls" class="hidden" style="margin-bottom: 40px;">
    <button class="btn btn-secondary nfs-font" style="border-radius: 6px" onclick="editTopic()">Edit</button>
    <button class="btn btn-danger nfs-font" style="border-radius: 6px" onclick="confirmDeleteTopic()">Delete topic</button>
  </div>

  <hr style="border: 0; border-top: 1px solid #222; margin: 40px 0;">

  <div id="commentsList">
    <h3 style="font-style: italic; text-transform: uppercase;">MESSAGE INTERCEPT:</h3>
  </div>

  <div id="replyBox">
    <h3 style="color: var(--nfs-yellow); font-style: italic; text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;">Send Reply</h3>
    <textarea id="commentText" rows="3" placeholder="Enter your message here..."></textarea>
    <button class="btn nfs-font" style="border-radius: 6px" onclick="postComment()">Send</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const topicId = urlParams.get('id');

  let myName = "";
  let currentUserId = null;
  let topicData = null;

  window.onload = async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if (user) {
      currentUserId = user.id;
      const { data: prof } = await _supabase.from('profiles').select('username').eq('id', user.id).single();
      if (prof) myName = prof.username;
    } else {
      window.location.href = 'auth.html';
      return;
    }
    await loadFullTopic();
    await loadComments();
  };

  async function loadFullTopic() {
    const { data, error } = await _supabase.from('forum_topics').select('*').eq('id', topicId).single();
    if (error || !data) {
      document.getElementById('topicDetail').innerHTML = "<h2>Topic not found.</h2>";
      return;
    }
    topicData = data;

    document.getElementById('topicDetail').innerHTML = `
      <div class="main-topic">
        <h1 style="color:var(--nfs-yellow); text-transform: uppercase; font-style: italic; margin-top: 0; font-size: 1.8rem; letter-spacing: 1px;">${data.title}</h1>
        <p class="user-text-content" style="white-space: pre-line; margin-bottom: 20px;">${data.content}</p>
        <small style="font-size: 0.8rem; color: #555; font-family: 'Wallpoet', sans-serif; text-transform: uppercase; letter-spacing: 1px;">Post author:
           <span class="racer-link" onclick="window.location.href='profile.html?u=${data.author_name}'">
             ${data.author_name}
           </span>
        </small>
      </div>
    `;
    if (currentUserId === data.author_id) {
      document.getElementById('authorControls').classList.remove('hidden');
    }
  }

  async function loadComments() {
    const { data } = await _supabase.from('forum_comments')
      .select('*')
      .eq('topic_id', topicId)
      .order('created_at', {ascending: true});

    const list = document.getElementById('commentsList');
    list.innerHTML = '<h3 style="border-bottom: 1px solid #222; padding-bottom: 10px; font-style: italic; font-size: 1.1rem; letter-spacing: 1px;">MESSAGE INTERCEPT:</h3>';

    if (data && data.length > 0) {
      data.forEach(c => {
        // Сделали вывод даты через компактный локальный формат
        const commentDate = new Date(c.created_at).toLocaleDateString('ru-RU') + ' ' + new Date(c.created_at).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});

        list.innerHTML += `
          <div class="comment">
            <div class="comment-meta">
               <span class="racer-link" onclick="window.location.href='profile.html?u=${c.author_name}'">
                 ${c.author_name}
               </span> • ${commentDate}
            </div>
            <div class="user-text-content" style="white-space: pre-line;">${c.content}</div>
          </div>
        `;
      });
    } else {
      list.innerHTML += '<p style="color: #444; font-size: 0.8rem; font-style: italic; padding-left: 5px;">It`s quiet here for now...</p>';
    }
  }

  async function postComment() {
    const text = document.getElementById('commentText').value.trim();
    if (!text) return;

    const { error } = await _supabase.from('forum_comments').insert([
      { topic_id: topicId, content: text, author_name: myName }
    ]);

    if (!error) {
      document.getElementById('commentText').value = '';
      if (typeof nfsNotify === 'function') nfsNotify("Ответ отправлен в сеть");
      loadComments();
    }
  }

  async function confirmDeleteTopic() {
    const result = await Swal.fire({
      title: 'Are you sure to delete this topic?',
      text: "This message will disappear from the archives forever!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#ff4d4d',
      confirmButtonText: 'YES I`M SURE',
      cancelButtonText: 'CANCEL',
      background: '#0a0a0a',
      color: '#fff',
      customClass: {
        popup: 'nfs-font',
        title: 'nfs-font',
        htmlContainer: 'nfs-font',
        confirmButton: 'nfs-font',
        cancelButton: 'nfs-font'
      }
    });

    if (result.isConfirmed) {
      const { error } = await _supabase.from('forum_topics').delete().eq('id', topicId);
      if (!error) {
        if (typeof nfsNotify === 'function') nfsNotify("Topic deleted");
        setTimeout(() => window.location.href = 'forum.html', 1000);
      }
    }
  }

  async function editTopic() {
    const { value: formValues } = await Swal.fire({
      title: 'EDIT THIS TOPIC',
      background: '#0a0a0a',
      color: '#fff',
      html:
        `<input id="swal-title" class="swal2-input nfs-font" placeholder="Title" value="${topicData.title}" style="background:#111; color:#fff; border:1px solid #444">` +
        `<textarea id="swal-content" class="swal2-textarea nfs-font" placeholder="Content" style="background:#111; color:#fff; border:1px solid #444; height: 150px;">${topicData.content}</textarea>`,
      confirmButtonText: 'SAVE CHANGES',
      confirmButtonColor: '#cca609',
      showCancelButton: true,
      cancelButtonText: 'CANCEL',
      customClass: {
        popup: 'nfs-font',
        title: 'nfs-font',
        confirmButton: 'nfs-font',
        cancelButton: 'nfs-font'
      },
      preConfirm: () => {
        return {
          title: document.getElementById('swal-title').value.trim(),
          content: document.getElementById('swal-content').value.trim()
        }
      }
    });

    if (formValues) {
      const { error } = await _supabase.from('forum_topics')
        .update({ title: formValues.title, content: formValues.content })
        .eq('id', topicId);
      if (!error) {
        if (typeof nfsNotify === 'function') nfsNotify("Data updated");
        loadFullTopic();
      }
    }
  }
</script>
</body>
</html>
