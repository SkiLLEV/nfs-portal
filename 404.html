<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ooops !</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-red: #ff4d4d;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
      url('https://images7.alphacoders.com/517/thumb-1920-517466.jpg');
      background-size: cover;
      background-position: center;
      color: #fff;
      font-family: 'Wallpoet', sans-serif !important;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    /* СКАНЕРНЫЕ ЛИНИИ (ЭФФЕКТ МОНИТОРА) */
    body::before {
      content: " ";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
      linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 2;
    }

    .error-container {
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #222;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
      padding: 60px;
      position: relative;
      z-index: 10;
      max-width: 500px;
    }

    .glitch {
      font-size: 5rem;
      font-weight: 900;
      margin: 0;
      color: var(--nfs-yellow);
      text-transform: uppercase;
      font-style: inherit;
      position: relative;
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0% {
        transform: skew(0deg);
      }
      20% {
        transform: skew(-2deg);
        text-shadow: 2px 0 red;
      }
      40% {
        transform: skew(2deg);
        text-shadow: -2px 0 blue;
      }
      60% {
        transform: skew(0deg);
      }
      100% {
        transform: skew(0deg);
      }
    }

    h2 {
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 10px 0 20px;
      color: #ccc;
    }

    /* ИСПРАВЛЕНО: ТЕКСТ ОШИБКИ ТЕПЕРЬ НА ЧИТАЕМОМ ARIAL И БЕЗ ИГРОВОГО ШРИФТА */
    p {
      font-family: 'Arial', 'Helvetica', sans-serif !important;
      font-size: 1.05rem;
      color: #bbbbbb;
      line-height: 1.6;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }

    .btn-back {
      background: var(--nfs-yellow);
      color: #000;
      border: none;
      padding: 15px 40px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 6px;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-back:hover {
      color: #ffffff;
      background-color: #c10e0e;
    }

    .police-code {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 0.7rem;
      color: #555;
      font-family: monospace;
      letter-spacing: 1px;
    }

    /* ПОЛИРОВКА СТИЛЯ: RESIDENT EVIL NOISE ANIMATION */
    .cover-noise {
      position: fixed;
      top: -50%;
      left: -50%;
      right: -50%;
      bottom: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 9999;
      animation: reNoiseAnimation 0.15s steps(2) infinite;
    }

    @keyframes reNoiseAnimation {
      0% {
        transform: translate(0, 0);
      }
      10% {
        transform: translate(-1%, -1%);
      }
      20% {
        transform: translate(-2%, 1%);
      }
      30% {
        transform: translate(1%, -2%);
      }
      40% {
        transform: translate(-1%, 3%);
      }
      50% {
        transform: translate(-2%, 1%);
      }
      60% {
        transform: translate(1%, 2%);
      }
      70% {
        transform: translate(2%, -2%);
      }
      80% {
        transform: translate(-1%, -1%);
      }
      90% {
        transform: translate(2%, 1%);
      }
      100% {
        transform: translate(1%, -1%);
      }
    }
  </style>
</head>
<body>

<div class="cover-noise"></div>

<div class="error-container">
  <div class="police-code">CODE: 10-44 / SIGNAL_LOST</div>
  <h1 class="glitch">404</h1>
  <p>The page you are looking for has fled in an unknown direction or never
    existed.</p>

  <a href="index.html" class="btn-back">RETURN BACK</a>
</div>

</body>
</html>
