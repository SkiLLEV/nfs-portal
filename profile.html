<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | Player Profile</title>

  <link rel="icon" href="https://i.postimg.cc/htQQdS85/IMG-3707.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-dark: rgba(15, 15, 15, 0.98);
      --nfs-border: #333;
      --admin-red: #e74c3c;
      --nfs-bg: url('https://i.postimg.cc/bYg9Jzpp/3458089.jpg');
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--nfs-bg) no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: 'Wallpoet', sans-serif !important;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ВОЗВРАЩАЕМ ЖЕЛТЫЙ ЦВЕТ ДЛЯ ВСЕХ ПОДСВЕТОК (ФУТЕР И Т.Д.) */
    .highlight {
      color: var(--nfs-yellow) !important;
    }

    .swal2-popup,
    .swal2-title,
    .swal2-html-container,
    .swal2-confirm,
    .swal2-cancel {
      font-family: 'Wallpoet', sans-serif !important;
    }

    /* ШАПКА В ПОЛОСКУ */
    .top-navbar {
      height: 70px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      box-sizing: border-box;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
      repeating-linear-gradient(-45deg, #0a0a0a, #0a0a0a 40px, rgba(241, 196, 15, 0.4) 40px, rgba(241, 196, 15, 0.4) 80px);
      border-bottom: 2px solid var(--nfs-yellow);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.7);
    }

    .sidebar {
      width: 250px;
      background: linear-gradient(
        to right,
        rgba(5, 5, 5, 0.98) 0%,
        rgba(12, 12, 12, 0.95) 60%,
        rgba(20, 20, 20, 0.85) 100%
      );
      backdrop-filter: blur(4px);
      height: auto;
      position: fixed;
      top: 70px;
      left: 0;
      border-right: 2px solid var(--nfs-border);
      padding-top: 0px;
      z-index: 999;
    }

    #displayNick {
      font-family: 'Wallpoet', sans-serif !important;
    }

    #displayNick:hover {
      text-decoration: underline;
    }

    /* УВЕДОМЛЕНИЯ */
    .notifications-wrapper {
      position: relative;
      margin-right: 20px;
      display: flex;
      align-items: center;
    }

    #notifyBell {
      cursor: pointer;
      position: relative;
      font-size: 22px;
      transition: 0.2s;
    }

    #notifyBell:hover {
      transform: scale(1.1);
    }

    #notifyCount {
      position: absolute;
      top: -5px;
      right: -8px;
      background: var(--admin-red);
      color: white;
      border-radius: 50%;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid white;
      display: none;
    }

    #notifyPopup {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      width: 280px;
      background: #0a0a0a;
      border: 2px solid var(--nfs-yellow);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .notify-header {
      padding: 10px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-size: 11px;
      font-weight: bold;
      color: var(--nfs-yellow);
      text-transform: uppercase;
    }

    .notify-item {
      padding: 12px;
      border-bottom: 1px solid #222;
    }

    .notify-btns {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .btn-acc {
      flex: 1;
      background: var(--nfs-yellow);
      border: none;
      padding: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 10px;
      text-transform: uppercase;
    }

    .btn-rej {
      flex: 1;
      background: #333;
      color: white;
      border: none;
      padding: 5px;
      cursor: pointer;
      font-size: 10px;
      text-transform: uppercase;
    }

    .btn-exit:hover {
      background: rgba(255, 68, 68, 0.2) !important;
      color: #ff6666 !important;
      border-color: #ff4444 !important;
    }

    .swal2-popup .swal2-confirm {
      transition: all 0.2s ease-in-out !important;
    }

    .swal2-popup .swal2-confirm:hover {
      background-color: #c10e0e !important;
      color: #ffffff !important;
    }

    .swal2-popup .swal2-cancel:hover {
      background-color: #333333 !important;
      color: #ff4444 !important;
    }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      transition: 0.3s;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(241, 196, 15, 0.1);
    }

    #msgBadge {
      background: var(--nfs-yellow);
      color: #000;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 900;
      border-radius: 2px;
      margin-left: 8px;
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
      display: none;
    }

    .container {
      margin-left: 280px;
      padding: 110px 40px 40px 40px;
    }

    /* СУПЕР СТИЛЬ ИЗ СКРИНШОТА STEAM */
    .profile-card {
      background: rgba(0, 0, 0, 0.85);
      padding: 40px;
      display: grid;
      grid-template-columns: 190px 1fr 240px;
      gap: 40px;
      align-items: flex-start;
      margin-bottom: 50px;
      position: relative;
    }

    .avatar-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 190px;
    }

    .avatar-area .btn-nfs, #statusSelect {
      width: 100%;
      margin: 0;
      box-sizing: border-box;
    }

    .avatar-area button + button {
      margin-top: 2px;
    }

    .avatar-big {
      width: 180px;
      height: 180px;
      background: #111;
      border: 3px solid var(--nfs-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-big img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-letter {
      font-size: 4rem;
      font-weight: 900;
      color: var(--nfs-yellow);
    }

    select {
      background: #111;
      color: #fff;
      border: 1px solid var(--nfs-yellow);
      padding: 12px 18px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      margin-top: 15px;
      width: 100%;
      text-transform: uppercase;
    }

    /* ЦЕНТРАЛЬНЫЙ БЛОК STEAM */
    .info-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-area h1 {
      margin: 0;
      font-size: 2.2rem;
      font-family: 'Wallpoet', sans-serif !important;
      font-weight: 400;
      color: #fff;
      text-transform: uppercase;
    }

    /* Ряд локации под ником */
    .steam-location-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #969696;
      font-family: sans-serif !important;
    }

    .status-badge {
      background: none !important;
      border: none !important;
      padding: 0 !important;
      font-size: 1.1rem !important;
      font-weight: bold !important;
      text-transform: uppercase;
      margin-top: 15px !important;
      margin-bottom: 0 !important;
    }

    .status-online {
      color: #57cbde !important;
    }

    .status-ingame {
      color: #90ba3c !important;
    }

    .status-offline {
      color: #8f98a0 !important;
    }

    /* КРАСИВЫЙ СТИЛЬ БИО В СТИЛЕ ОПИСАНИЯ STEAM */
    #profBio {
      color: #bbbbbb;
      margin: 10px 0;
      font-size: 1.05rem;
      font-family: sans-serif !important;
      line-height: 1.5;
    }

    /* ПРАВАЯ СТОРОНА HUD */
    .right-stats-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .steam-level-box {
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid #333;
      padding: 12px;
      text-align: left;
    }

    .steam-level-text {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-block-custom {
      text-align: left;
      padding-left: 5px;
    }

    .stat-label-custom {
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .btn-tuning {
      background-color: #222222;
      border: 2px solid var(--nfs-yellow);
      color: var(--nfs-yellow);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      font-size: 0.75rem;
      transition: all 0.3s ease;

      width: max-content !important;
      min-width: 120px;
      align-self: flex-start;
    }

    .btn-tuning:hover {
      color: #fff;
      border-color: white;
      background-color: #c10e0e;
    }

    #addCarBtn {
      position: static !important;
      background-color: #222222 !important;
      color: var(--nfs-yellow);
      border: 2px solid var(--nfs-yellow);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #addCarBtn:hover {
      color: #fff;
      border-color: white !important;
      background-color: #c10e0e !important;
    }

    .btn-nfs {
      background: var(--nfs-yellow);
      color: #000;
      border: none;
      margin-top: 10px;
      font-size: 0.8rem;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      display: block;
      width: 100%;
    }

    .gallery-title {
      font-size: 1.5rem;
      font-weight: 900;
      padding-left: 10px;
      border-left: 4px solid var(--nfs-yellow);
      text-transform: uppercase;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    .car-card {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 5px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: zoom-in;
      overflow: hidden;
    }

    .car-card:hover {
      border-color: var(--nfs-yellow);
      transform: scale(1.05) translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(241, 196, 15, 0.3);
      z-index: 10;
    }

    .car-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      transition: 0.3s;
    }

    .car-card:hover img {
      filter: brightness(1.1);
    }

    .admin-glow {
      color: #ff4d4d !important;
      text-shadow: 0 0 10px #ff0000;
    }

    .vip-glow {
      color: #f1c40f !important;
      text-shadow: 0 0 8px #f1c40f;
    }

    .badge {
      font-size: 0.9rem;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 8px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-admin {
      background: #ff4d4d;
      color: white;
      border: 2px solid #da0000;
    }

    .badge-vip {
      background: var(--nfs-yellow);
      color: black;
      border: 2px solid #000;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(10, 10, 10, 0.95) 50%, rgba(20, 20, 20, 0.9) 100%);
      backdrop-filter: blur(4px);
      padding: 15px 0;
      border-top: 2px solid var(--nfs-yellow);
      text-align: center;
      font-size: 0.9rem;
      z-index: 1000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }

    /* Рамки для аватарок */
    .avatar-container {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      transition: transform 0.3s ease;
    }

    .frame-mw {
      background: repeating-linear-gradient(-45deg, #ff8c00, #ff8c00 15px, #000 15px, #000 30px);
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
      border: 2px solid #000;
    }

    .avatar-container .avatar-big {
      width: 100%;
      height: 100%;
      background: #000;
      border: none;
      z-index: 2;
    }

    .swal-avatar-item.active-choice {
      border-color: #f1c40f !important;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }

    .nfs-font {
      font-family: 'Wallpoet', sans-serif !important;
    }

    /* АДАПТИВНОСТЬ */
    @media screen and (max-width: 768px) {
      .top-navbar {
        position: fixed !important;
        padding: 0 15px !important;
      }

      #displayNick {
        font-family: 'Wallpoet', sans-serif !important;
        max-width: 80px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      aside.sidebar {
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin-top: 70px !important;
        padding-top: 0 !important;
        border-right: none !important;
        border-bottom: 2px solid var(--nfs-border) !important;
        z-index: 999 !important;
        display: block !important;
      }

      .sidebar nav {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: space-around !important;
        padding: 5px 0 !important;
      }

      .nav-item {
        flex: 1 1 30% !important;
        min-width: 95px !important;
        padding: 12px 5px !important;
        font-size: 0.75rem !important;
        text-align: center !important;
        border-bottom: 1px solid #222 !important;
        box-sizing: border-box !important;
      }

      .container {
        margin-left: 0 !important;
        padding: 20px 15px 140px 15px !important;
        box-sizing: border-box !important;
        width: 100% !important;
      }

      .profile-card {
        grid-template-columns: 1fr !important;
        gap: 20px !important;
        padding: 20px !important;
        text-align: center !important;
      }

      .avatar-area {
        width: 100% !important;
        max-width: 190px !important;
        margin: 0 auto;
      }

      .info-area {
        align-items: center !important;
      }

      .steam-location-row {
        justify-content: center !important;
      }

      .right-stats-area {
        text-align: center !important;
        align-items: center;
      }

      .steam-level-box {
        text-align: center !important;
        width: 100%;
        box-sizing: border-box;
      }

      .stat-block-custom {
        text-align: center !important;
      }

      .gallery {
        grid-template-columns: 1fr !important;
        gap: 15px !important;
      }

      .bottom-bar {
        font-size: 0.75rem !important;
        padding: 12px 0 !important;
      }
    }
  </style>
</head>
<body>

<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 15px;">
    <img src="https://i.postimg.cc/KjhYnZ7S/IMG-4583.png" alt="NFS Logo"
         style="height: 65px; width: auto; filter: drop-shadow(2px 2px 5px #000);">
    <div
      style="font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 5px #000; font-style: italic; text-transform: uppercase;">
      PLAYER PROFILE
    </div>
  </div>

  <div class="user-area" style="display: flex; align-items: center; gap: 20px;">
    <div class="notifications-wrapper" id="notifyWrapper"
         style="position: relative; display: flex; align-items: center;">
      <div id="notifyBell" onclick="toggleNotifyPopup()" style="cursor: pointer; display: flex; align-items: center;">
        <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notifyCount" style="margin-left: 5px;">0</span>
      </div>

      <div id="notifyPopup"
           style="display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a; border: 1px solid #333; z-index: 100; min-width: 200px; margin-top: 10px;">
        <div class="notify-header nfs-font"
             style="padding: 10px; color: #fff; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 0.8rem;">
          Friend requests
        </div>
        <div id="notifyList"></div>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="openModal()" style="display: none;">LOGIN</button>

    <div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 15px;">
      <span id="displayNick"
            style="font-weight: bold; cursor: pointer; color: #ffffff; text-shadow: 0 0 8px rgba(0,0,0,0.6);"
            onclick="window.location.href='profile.html'">
        Davenport
      </span>
      <button onclick="handleLogout()" class="nfs-font btn-exit"
              style="background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 5px; color: #ff4444; cursor: pointer; font-size: 0.75rem; padding: 6px 12px; font-weight: bold; text-transform: uppercase;">
        EXIT
      </button>
    </div>
  </div>
</header>

<aside class="sidebar">
  <nav style="padding-top: 1px;">
    <a href="index.html" class="nav-item">MAIN</a>
    <a href="forum.html" class="nav-item">FORUM</a>
    <a href="chats.html" class="nav-item">MESSENGER<span id="msgBadge">0</span></a>
    <a href="lobby.html" class="nav-item">SEARCH THE GAME</a>
    <a href="leaderboard.html" class="nav-item">LEADERBOARD</a>
    <a href="profile.html" class="nav-item active">MY PROFILE</a>
  </nav>
</aside>

<div class="container">
  <div class="profile-card">

    <div class="avatar-area">
      <div id="avatarFrame" class="avatar-container" onclick="openAvatarPicker()"
           style="cursor: pointer; position: relative; z-index: 10;">
        <div class="avatar-big" id="avatarBox">
          <span class="avatar-letter">?</span>
        </div>
      </div>

      <select id="statusSelect" class="nfs-font hidden" onchange="updateUserStatus()">
        <option value="ONLINE">NOT LOOKING</option>
        <option value="LOOKING FOR GAME">LOOKING FOR GAME</option>
      </select>
      <button id="msgBtn" class="btn-nfs nfs-font hidden" style="border-radius: 6px" onclick="goToChat()">✉ TO WRITE
      </button>
      <button id="friendBtn" style="border-radius: 6px" class="btn-nfs nfs-font hidden">ADD TO FRIENDS</button>
    </div>

    <div class="info-area">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="badgeContainer"></span>
        <h1><span id="profName">Loading...</span></h1>
      </div>

      <div class="steam-location-row">
        <img src="https://flagcdn.com/w20/us.png" srcset="https://flagcdn.com/w40/us.png 2x" width="20" alt="USA"
             style="display: inline-block; border: 1px solid #111;">
        <span>United States</span>
      </div>

      <div id="muteInfo"></div>

      <p id="profBio">Loading...</p>

      <div id="statusIndicator" class="status-badge status-online">OFFLINE</div>

      <button id="adminMuteBtn" class="btn-nfs nfs-font hidden"
              style="background: #c0392b; color: #fff; border: 1px solid #ff4d4d; margin-top: 15px; max-width: 200px;"
              onclick="openMuteModal()">
        ⚠ ISSUE A MUT
      </button>
    </div>

    <div class="right-stats-area">
      <div class="steam-level-box">
        <span class="steam-level-text nfs-font">Level <span class="highlight" id="profLevel">1</span></span>
      </div>

      <button id="editBtn" class="btn-tuning nfs-font hidden" onclick="openEditProfile()">Edit Profile</button>

      <div class="stat-block-custom" style="margin-top: 10px; border-top: 1px solid #222; padding-top: 15px;">
        <div class="stat-label-custom nfs-font">Rating</div>
        <div class="highlight nfs-font" style="font-size: 1.3rem;">
          <span id="profRating">★ 0</span> <span id="rankDisplay"
                                                 style="font-style: italic; font-size: 1.1rem; color: #fff; margin-left: 5px;">(#--)</span>
        </div>
      </div>
    </div>

  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div class="gallery-title" id="garageTitle">RACER'S GARAGE</div>
    <button id="addCarBtn" class="btn-tuning nfs-font hidden" style="width: auto !important; padding: 10px 20px;"
            onclick="addNewCarPhoto()">+ ADD A CAR
    </button>
  </div>
  <div class="gallery" id="garageContainer"></div>
</div>

<footer class="bottom-bar">
  <div>ONLINE: <span class="highlight" id="footerOnline">0</span> | IN THE RACE: <span class="highlight"
                                                                                       id="footerPlaying">0</span></div>
</footer>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  if (typeof onlineUsers === 'undefined') window.onlineUsers = {};

  const AVATAR_OPTIONS = [
    'https://cs9.pikabu.ru/post_img/2017/02/16/9/1487255861137287071.png',
    'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEveKMVakzm3H74-BgFH8JGuoTkavsfgIAaw&s',
    'https://static.wikia.nocookie.net/needforspeed/images/e/ee/TazProfileIcon.png/revision/latest/scale-to-width-down/220?cb=20160105211008&path-prefix=ru',
    'https://static.wikia.nocookie.net/nfs/images/6/6f/Sonny.png/revision/latest/smart/width/250/height/250?cb=20150519180637&path-prefix=es'
  ];

  function formatLastSeen(dateString) {
    if (!dateString) return "Long ago";
    const now = new Date();
    const lastSeen = new Date(dateString);
    const diffInSeconds = Math.floor((now - lastSeen) / 1000);
    if (diffInSeconds < 60) return "Just now";
    if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} min. ago`;
    if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} h. ago`;
    return lastSeen.toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});
  }

  window.currentUserId = null;
  window.myProfile = null;
  window.profileData = null;

  window.onload = async () => {
    const {data: {user}} = await _supabase.auth.getUser();
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    window.currentUserId = user.id;

    const {data: me} = await _supabase.from('profiles').select('*').eq('id', window.currentUserId).single();
    if (me) {
      window.myProfile = me;
      const nickEl = document.getElementById('displayNick');
      if (nickEl) nickEl.innerText = me.username;
      if (typeof updateFriendNotifications === 'function') updateFriendNotifications();
      if (typeof initGlobalStatus === 'function') initGlobalStatus(_supabase, me);
      if (typeof updateGlobalMsgBadge === 'function') updateGlobalMsgBadge(_supabase, me.id);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const targetName = urlParams.get('u');

    if (targetName) {
      const {data} = await _supabase.from('profiles').select('*').ilike('username', targetName).maybeSingle();
      if (data) {
        window.profileData = data;
        setupProfileRealtimeListener();
        renderFullProfile(data, data.id === window.currentUserId);
        updateRacerRank(data.id);
        if (data.id !== window.currentUserId) checkFriendshipStatus(data.id);
      } else {
        loadMyOwnProfile(user.id);
      }
    } else {
      loadMyOwnProfile(user.id);
    }
  };

  window.updateLiveStatusUI = function () {
    const el = document.getElementById('statusIndicator');
    if (!el || !window.profileData) return;

    const presence = (typeof onlineUsers !== 'undefined' ? onlineUsers[window.profileData.username] : null);
    const isItMe = (window.myProfile && window.profileData.id === window.myProfile.id);

    let s = 'ONLINE';

    if (isItMe) {
      const statusSelect = document.getElementById('statusSelect');
      s = statusSelect ? statusSelect.value : (window.myProfile.status || 'ONLINE');
    } else if (presence && presence[0] && presence[0].status) {

      s = presence[0].status;
    } else {
      s = window.profileData.status || 'ONLINE';
    }

    if (!presence && !isItMe) {
      let lastSeenTime = "long ago";
      if (window.profileData.last_seen) lastSeenTime = formatLastSeen(window.profileData.last_seen);
      el.innerHTML = `<div>Currently Offline</div><div style="font-size: 1.05rem; font-weight: normal; color: #8f98a0; margin-top: 2px;">Last Online ${lastSeenTime}</div>`;
      el.className = 'status-badge status-offline';
    } else {

      if (s === 'LOOKING FOR GAME') {
        el.innerHTML = `<div>LFG</div>`;
        el.className = 'status-badge status-ingame';
      } else {
        el.innerHTML = '<div>Currently Online</div>';
        el.className = 'status-badge status-online';
      }
    }
  };

  async function loadMyOwnProfile(userId) {
    try {
      const {data, error} = await _supabase.from('profiles').select('*').eq('id', userId).single();
      if (error) throw error;
      if (data) {
        window.profileData = data;
        setupProfileRealtimeListener();
        renderFullProfile(data, true);
        updateRacerRank(data.id);
      }
    } catch (err) {
      console.error("Error loading your profile:", err);
      document.getElementById('profName').innerText = "ERROR!";
    }
  }

  async function updateRacerRank(targetUserId) {
    const {data: racers} = await _supabase.from('profiles').select('id').order('rating', {ascending: false});
    if (racers) {
      const rank = racers.findIndex(r => r.id === targetUserId) + 1;
      const rankEl = document.getElementById('rankDisplay');
      if (rankEl) rankEl.innerText = `(#${rank})`;
    }
  }

  function renderFullProfile(data, isMine) {
    const nameEl = document.getElementById('profName');
    const badgeEl = document.getElementById('badgeContainer');
    const frameEl = document.getElementById('avatarFrame');

    if (frameEl) {
      frameEl.className = 'avatar-container';
      if (data.selected_frame) frameEl.classList.add(data.selected_frame);
      else if (data.username === 'Davenport' || data.username === 'test1') frameEl.classList.add('frame-mw');
      else if (data.is_admin) frameEl.classList.add('frame-admin');
      else if (data.is_mod) frameEl.classList.add('frame-mod');
      else if (data.is_vip) frameEl.classList.add('frame-vip');
      else frameEl.classList.add('frame-default');
    }

    if (nameEl) {
      nameEl.innerText = data.username;
      if (data.is_admin) {
        nameEl.classList.add('admin-glow');
        badgeEl.innerHTML = `<span class="badge badge-admin">ADM</span>`;
      } else if (data.is_vip) {
        nameEl.classList.add('vip-glow');
        badgeEl.innerHTML = `<span class="badge badge-vip">VIP</span>`;
      } else {
        badgeEl.innerHTML = '';
      }
    }

    if (typeof renderMuteStatus === 'function') renderMuteStatus(data);

    const adminMuteBtn = document.getElementById('adminMuteBtn');
    if (adminMuteBtn) {
      if (window.myProfile && window.myProfile.is_admin && !isMine) adminMuteBtn.classList.remove('hidden');
      else adminMuteBtn.classList.add('hidden');
    }

    document.getElementById('profBio').innerText = data.bio || "Elite racer of Rockport";
    document.getElementById('profRating').innerText = `★ ${data.rating.toLocaleString()}`;

    const levelEl = document.getElementById('profLevel');
    if (levelEl) {
      levelEl.innerText = data.level || 1;
    }

    const box = document.getElementById('avatarBox');
    if (box) {
      box.innerHTML = data.avatar_url
        ? `<img src="${data.avatar_url}">`
        : `<span class="avatar-letter">${data.username[0].toUpperCase()}</span>`;
    }

    renderGarage(data.photos);
    window.updateLiveStatusUI();

    const editBtn = document.getElementById('editBtn');
    const statusSelect = document.getElementById('statusSelect');
    const addCarBtn = document.getElementById('addCarBtn');
    const msgBtn = document.getElementById('msgBtn');
    const friendBtn = document.getElementById('friendBtn');

    if (isMine) {
      if (editBtn) editBtn.classList.remove('hidden');
      if (statusSelect) {
        statusSelect.classList.remove('hidden');
        statusSelect.value = data.status || 'ONLINE';
      }
      if (addCarBtn) addCarBtn.classList.remove('hidden');
      if (msgBtn) msgBtn.classList.add('hidden');
      if (friendBtn) friendBtn.classList.add('hidden');
    } else {
      if (editBtn) editBtn.classList.add('hidden');
      if (statusSelect) statusSelect.classList.add('hidden');
      if (addCarBtn) addCarBtn.classList.add('hidden');
      if (msgBtn) msgBtn.classList.remove('hidden');
      if (friendBtn) friendBtn.classList.remove('hidden');
    }
  }

  function renderGarage(photos) {
    const container = document.getElementById('garageContainer');
    if (!container) return;
    container.innerHTML = photos?.length ? '' : '<p style="color:#555">Avoid...</p>';
    photos?.forEach((url) => {
      container.innerHTML += `
          <div class="car-card" onclick="viewFullImage('${url}')">
            <img src="${url}">
          </div>`;
    });
  }

  function viewFullImage(url) {
    Swal.fire({
      imageUrl: url,
      background: 'rgba(0,0,0,0.9)',
      showConfirmButton: false,
      showCloseButton: true,
      width: 'auto'
    });
  }

  async function addNewCarPhoto() {
    const {value: url} = await Swal.fire({
      title: 'GARAGE TUNING',
      background: '#0a0a0a',
      color: '#fff',
      input: 'url',
      inputLabel: 'STEP 1: Add your photo on PostImages\nSTEP 2: Insert a DIRECT LINK below (.jpg, .png)',
      inputPlaceholder: 'https://i.postimg.cc/..../image.jpg',
      confirmButtonText: 'IN GARAGE',
      confirmButtonColor: '#373737',
      footer: `
        <a href="https://postimages.org/" target="_blank" class="nfs-font"
           style="color: #f1c40f; font-weight: bold; text-decoration: none; transition: color 0.2s ease;"
           onmouseover="this.style.color='#ff0000'; this.style.textDecoration='underline';"
           onmouseout="this.style.color='#f1c40f'; this.style.textDecoration='none';">
          TO OPEN POSTIMAGES.ORG
        </a>`,
      showCancelButton: true,
      cancelButtonText: 'CANCEL',
      customClass: {popup: 'nfs-font', title: 'nfs-font', confirmButton: 'nfs-font', cancelButton: 'nfs-font'}
    });

    if (url) {
      if (!url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
        Swal.fire({
          title: 'ERROR',
          text: 'That`s not direct link!',
          icon: 'error',
          background: '#0a0a0a',
          color: '#fff'
        });
        return;
      }
      const currentPhotos = Array.isArray(window.profileData.photos) ? window.profileData.photos : [];
      const updatedPhotos = [...currentPhotos, url];
      const {error} = await _supabase.from('profiles').update({photos: updatedPhotos}).eq('id', window.currentUserId);
      if (!error) {
        if (typeof nfsNotify === 'function') nfsNotify('Your auto has been added!');
        setTimeout(() => location.reload(), 1200);
      }
    }
  }

  async function updateUserStatus() {
    const s = document.getElementById('statusSelect').value;
    const {error} = await _supabase.from('profiles').update({status: s}).eq('id', window.currentUserId);
    if (!error) {
      if (window.profileData) window.profileData.status = s;
      if (window.myProfile) window.myProfile.status = s;
      if (typeof window.trackMyStatus === 'function') await window.trackMyStatus(s);
      window.updateLiveStatusUI();
      if (typeof nfsNotify === 'function') nfsNotify('Status updated: ' + s);
    }
  }

  async function openEditProfile() {
    const frames = [
      {id: 'frame-default', name: 'Standart'},
      {id: 'frame-mw', name: 'Most Wanted'},
    ];
    let framesHtml = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">';
    frames.forEach(f => {
      const isSelected = window.profileData.selected_frame === f.id ? 'border: 2px solid var(--nfs-yellow);' : 'border: 1px solid #333;';
      framesHtml += `<div onclick="selectFrame('${f.id}')" id="${f.id}" class="frame-preview ${f.id}" style="cursor:pointer; padding:10px; ${isSelected} background: rgba(0,0,0,0.5); font-size: 0.7rem;">${f.name.toUpperCase()}</div>`;
    });
    framesHtml += '</div>';

    const {value: formValues} = await Swal.fire({
      background: '#0a0a0a', color: '#fff',
      html: `
          <p style="font-size:0.8rem; text-align:left;">BIO:</p>
          <input id="swal-bio" class="swal2-input" value="${window.profileData.bio || ''}" style="background:#111; color:#fff; width:100%; box-sizing:border-box;">
          <p style="margin-top:15px; font-size:0.8rem; text-align:left;">FRAME SELECTION:</p>
          ${framesHtml}
        `,
      showCancelButton: true,
      confirmButtonText: 'TO SET IT!',
      confirmButtonColor: '#373737',
      customClass: {popup: 'nfs-font', title: 'nfs-font', confirmButton: 'nfs-font', cancelButton: 'nfs-font'},
      preConfirm: () => {
        return {
          bio: document.getElementById('swal-bio').value,
          frame: window.tempSelectedFrame || window.profileData.selected_frame
        }
      }
    });

    if (formValues) {
      const {error} = await _supabase.from('profiles').update({
        bio: formValues.bio,
        selected_frame: formValues.frame
      }).eq('id', window.currentUserId);
      if (!error) location.reload();
    }
  }

  window.selectFrame = (id) => {
    window.tempSelectedFrame = id;
    document.querySelectorAll('.frame-preview').forEach(el => el.style.border = '1px solid #333');
    document.getElementById(id).style.border = '2px solid var(--nfs-yellow)';
  };

  async function checkFriendshipStatus(targetUserId) {
    const {data: request} = await _supabase.from('friend_requests').select('*').or(`and(sender_id.eq.${window.myProfile.id},receiver_id.eq.${targetUserId}),and(sender_id.eq.${targetUserId},receiver_id.eq.${window.myProfile.id})`).maybeSingle();
    const btn = document.getElementById('friendBtn');
    if (!btn) return;
    btn.classList.remove('hidden');
    if (!request) {
      btn.innerText = "ADD TO FRIENDS";
      btn.onclick = () => sendFriendRequest(targetUserId);
    } else if (request.status === 'pending') {
      if (request.sender_id === window.myProfile.id) {
        btn.innerText = "THE REQUEST HAS BEEN SENT";
        btn.disabled = true;
      } else {
        btn.innerText = "ACCEPT THE REQUEST";
        btn.onclick = () => acceptFriendRequest(request.id);
      }
    } else if (request.status === 'accepted') {
      btn.innerText = "REMOVE FROM FRIENDS";
      btn.style.background = "#e74c3c";
      btn.style.color = "#fff";
      btn.style.border = "2px solid #c0392b";
      btn.onclick = () => removeFriend(request.id);
    }
  }

  async function sendFriendRequest(targetId) {
    await _supabase.from('friend_requests').insert([{
      sender_id: window.myProfile.id,
      receiver_id: targetId,
      sender_name: window.myProfile.username
    }]);
    location.reload();
  }

  async function acceptFriendRequest(requestId) {
    await _supabase.from('friend_requests').update({status: 'accepted'}).eq('id', requestId);
    location.reload();
  }

  async function removeFriend(requestId) {
    await _supabase.from('friend_requests').delete().eq('id', requestId);
    location.reload();
  }

  async function openMuteModal() {
    if (!window.myProfile || !window.myProfile.is_admin || !window.profileData) return;
    const {value: minutes} = await Swal.fire({
      title: 'ВЫДАТЬ МУТ',
      input: 'select',
      inputOptions: {'15': '15 минут', '60': '1 час', '1440': '24 часа', '10080': '7 дней'},
      inputPlaceholder: 'Выберите срок наказания',
      showCancelButton: true,
      background: '#0a0a0a', color: '#ffffff', confirmButtonColor: '#ff4d4d', confirmButtonText: 'ЗАМУТИТЬ'
    });

    if (minutes) {
      const mutedUntil = new Date(Date.now() + minutes * 60000).toISOString();
      const {error} = await _supabase.from('profiles').update({muted_until: mutedUntil}).eq('id', window.profileData.id);
      if (!error) {
        if (typeof nfsNotify === 'function') nfsNotify('НАРУШИТЕЛЬ ОШТРАФОВАН!');
        window.profileData.muted_until = mutedUntil;
        renderMuteStatus(window.profileData);
        setTimeout(() => location.reload(), 1200);
      }
    }
  }

  function setupProfileRealtimeListener() {
    if (!window.profileData) return;
    _supabase.removeChannel(_supabase.channel(`profile-db-changes-${window.profileData.id}`));
    _supabase.channel(`profile-db-changes-${window.profileData.id}`)
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'profiles',
        filter: `id=eq.${window.profileData.id}`
      }, (payload) => {
        window.profileData = payload.new;
        window.updateLiveStatusUI();
      })
      .subscribe();
  }

  window.updateSteamFriendsWidgetOnly = function () {
    if (typeof refreshSteamFriendsList === 'function' && window.myProfile) {
      refreshSteamFriendsList(_supabase, window.myProfile);
    }
  };
</script>
</body>
</html>
