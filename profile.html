<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | Player Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="utils.js"></script>

  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-dark: rgba(15, 15, 15, 0.98);
      --nfs-border: #333;
      --nfs-bg: url('https://images7.alphacoders.com/517/thumb-1920-517466.jpg');
    }

    body {
      margin: 0; padding: 0;
      background: var(--nfs-bg) no-repeat center center fixed;
      background-size: cover;
      color: #fff; font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ШАПКА В ПОЛОСКУ */
    .top-navbar {
      height: 70px; position: fixed; top: 0; width: 100%; z-index: 1100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 40px; box-sizing: border-box;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
      repeating-linear-gradient(-45deg, #0a0a0a, #0a0a0a 40px, rgba(241, 196, 15, 0.4) 40px, rgba(241, 196, 15, 0.4) 80px);
      border-bottom: 2px solid var(--nfs-yellow); box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    }

    .title-container { font-size: 1.5rem; font-weight: 900; font-style: italic; text-transform: uppercase; text-shadow: 2px 2px 5px #000; }
    .sidebar {
      width: 250px; background: var(--nfs-dark); height: 100vh;
      position: fixed; top: 70px; left: 0;
      border-right: 2px solid var(--nfs-border); padding-top: 20px; z-index: 999;
    }

    .nav-item { display: block; padding: 20px 30px; color: #bbb; text-decoration: none; text-transform: uppercase; transition: 0.3s; }
    .nav-item:hover, .nav-item.active { color: #fff; background: rgba(241, 196, 15, 0.1); border-left: 5px solid var(--nfs-yellow); }

    /* БЕЙДЖ СООБЩЕНИЙ */
    #msgBadge {
      background: var(--nfs-yellow); color: #000; padding: 2px 6px;
      font-size: 0.7rem; font-weight: 900; border-radius: 2px;
      margin-left: 8px; box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
      display: none;
    }

    .container { margin-left: 280px; padding: 110px 40px 40px 40px; }
    .profile-card { background: rgba(0,0,0,0.85); padding: 40px; border-left: 5px solid var(--nfs-yellow); display: flex; gap: 40px; align-items: flex-start; margin-bottom: 50px; position: relative; box-shadow: 10px 10px 0px rgba(0,0,0,0.5); }

    .avatar-area { text-align: center; }
    .avatar-big { width: 180px; height: 180px; background: #111; border: 3px solid var(--nfs-yellow); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-letter { font-size: 4rem; font-weight: 900; color: var(--nfs-yellow); }

    select { background: #111; color: #fff; border: 1px solid var(--nfs-yellow); padding: 12px 18px; font-size: 1.1rem; font-weight: bold; cursor: pointer; outline: none; margin-top: 15px; width: 100%; text-transform: uppercase; }
    .info-area h1 { margin: 0; font-size: 2.5rem; text-transform: uppercase; display: flex; align-items: center; }
    .clan-tag { color: var(--nfs-yellow); margin-right: 15px; }

    .status-badge {
      display: inline-block;
      padding: 5px 15px; background: #222;
      font-size: 0.8rem;
      font-weight: bold;
      margin: 15px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    border-radius: 3px; }

    .status-online {
      color: #5ac0ff;
      border: 1px solid #5ac0ff;
      border-radius: 8px; }

    .status-ingame {
      color: var(--nfs-yellow);
      border: 1px solid var(--nfs-yellow); }

    .status-offline {
      color: #888; border: 1px solid #444;
      background: #111; }

    .stat-line { font-size: 1.2rem; color: #ccc; margin: 10px 0; }
    .highlight { color: var(--nfs-yellow); font-weight: bold; }
    .btn-tuning { position: absolute; top: 30px; right: 30px; background: none; border: 1px solid var(--nfs-yellow); color: var(--nfs-yellow); padding: 8px 20px; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: 0.3s; font-size: 0.75rem; }
    .btn-tuning:hover { background: var(--nfs-yellow); color: #000; }
    .btn-nfs { background: var(--nfs-yellow); color: #000; border: none; margin-top: 10px; font-size: 0.8rem; padding: 10px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; display: block; width: 100%; transition: 0.2s; }
    .btn-nfs:hover:not(:disabled) { background: #fff; transform: scale(1.05); }

    .gallery-title { font-size: 1.5rem; font-weight: 900; padding-left: 10px; border-left: 4px solid var(--nfs-yellow); text-transform: uppercase; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
    .car-card {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 5px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: zoom-in; /* Курсор лупы */
      overflow: hidden;
    }

    /* ТОТ САМЫЙ ЭФФЕКТ НАВЕДЕНИЯ */
    .car-card:hover {
      border-color: var(--nfs-yellow);
      transform: scale(1.05) translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(241, 196, 15, 0.3);
      z-index: 10;
    }
    .car-card img { width: 100%; height: 180px; object-fit: cover; transition: 0.3s; }
    .car-card:hover img { filter: brightness(1.1); }
    .car-card img { width: 100%; height: 180px; object-fit: cover; }

    .admin-glow { color: #ff4d4d !important; text-shadow: 0 0 10px #ff0000; }
    .vip-glow { color: #f1c40f !important; text-shadow: 0 0 8px #f1c40f; }
    .badge { font-size: 0.9rem; padding: 2px 6px; border-radius: 3px; margin-right: 8px; font-weight: bold; }
    .badge-admin { background: #ff4d4d; color: white; border: 2px solid #da0000; }
    .badge-vip { background: var(--nfs-yellow); color: black; border: 2px solid #000; }

    .bottom-bar {
      position: fixed; bottom: 0; width: 100%;
      background: rgba(0,0,0,0.95); padding: 15px 0;
      border-top: 2px solid var(--nfs-yellow);
      text-align: center; font-size: 0.9rem; z-index: 1000;
      text-transform: uppercase; letter-spacing: 1px;
    }

    .hidden { display: none !important; }
    .swal-avatar-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .swal-avatar-item { width: 60px; height: 60px; cursor: pointer; border: 2px solid transparent; }
    .swal-avatar-item.selected { border-color: var(--nfs-yellow); transform: scale(1.1); }

    /* Общий контейнер для рамки */
    .avatar-container {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px; /* Толщина рамки */
      transition: transform 0.3s ease;
    }

    .avatar-container:hover {
      transform: scale(1.05);
    }

    /* 🟠 MOST WANTED */
    .frame-mw {
      background: repeating-linear-gradient(
        -45deg,
        #ff8c00, #ff8c00 15px,
        #000 15px, #000 30px
      );
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
      border: 2px solid #000;
    }

    /* 🔴 ADMIN */
    .frame-admin {
      background: #ff4d4d;
      box-shadow: 0 0 15px #ff0000, inset 0 0 10px #000;
      animation: admin-glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes admin-glow {
      from { box-shadow: 0 0 10px #ff0000; }
      to { box-shadow: 0 0 25px #ff4d4d; }
    }

    /* 🟡 VIP */
    .frame-vip {
      background: linear-gradient(135deg, #f1c40f 0%, #9b7b00 50%, #f1c40f 100%);
      border: 2px solid #444;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
    }

    /* 🔵 MODERATOR */
    .frame-mod {
      background: #3498db;
      box-shadow: 0 0 15px #2980b9;
      border: 2px dashed #fff;
    }

    /* ⚪️ NEWBIE */
    .frame-default {
      background: rgba(255,255,255,0.1);
      border: 2px solid #333;
    }

    /* Внутренний бокс для фото */
    .avatar-container .avatar-big {
      width: 100%;
      height: 100%;
      background: #000;
      border: none; /* Убираем старую рамку */
      z-index: 2;
    }

    /* 🟣 PURPLE GHOST */
    .frame-purple {
      background: #a29bfe;
      box-shadow: 0 0 15px #6c5ce7, inset 0 0 10px #000;
      animation: purple-pulse 2s infinite alternate;
    }

    @keyframes purple-pulse {
      from { box-shadow: 0 0 5px #6c5ce7; }
      to { box-shadow: 0 0 20px #a29bfe; }
    }

    /* 🟢 TOXIC DRIFT */
    .frame-toxic {
      background: #55efc4;
      border: 2px dashed #00b894;
      box-shadow: 0 0 15px rgba(85, 239, 196, 0.5);
    }

    /* ⚡ NITRO SPARKS */
    .frame-sparks {
      background: #111;
      border: 2px solid #fdcb6e;
      position: relative;
      overflow: hidden;
    }

    .frame-sparks::after {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, #fdcb6e 1px, transparent 1px);
      background-size: 10px 10px;
      animation: sparks-move 4s linear infinite;
      opacity: 0.3;
    }

    @keyframes sparks-move {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .frame-ice {
      background: linear-gradient(45deg, #74b9ff, #0984e3);
      box-shadow: 0 0 15px #74b9ff;
      border-radius: 10px; /* Скругленные углы для мягкости */
    }

    .frame-carbon {
      background:
        linear-gradient(27deg, #151515 5px, transparent 5px) 0 5px,
        linear-gradient(207deg, #151515 5px, transparent 5px) 10px 0,
        linear-gradient(27deg, #222 5px, transparent 5px) 0 10px,
        linear-gradient(207deg, #222 5px, transparent 5px) 10px 5px,
        linear-gradient(90deg, #1b1b1b 10px, transparent 10px),
        linear-gradient(#1d1d1d 25%, #1a1a1a 25%, #1a1a1a 50%, transparent 50%, transparent 75%, #242424 75%, #242424);
      background-size: 20px 20px;
      border: 1px solid #444;
    }

    .frame-void {
      background: #000;
      border: 1px solid #333;
      box-shadow: 0 0 20px #fff, inset 0 0 30px #4834d4;
      outline: 1px solid #4834d4;
      animation: void-pulse 4s infinite;
    }
    @keyframes void-pulse {
      0% { box-shadow: 0 0 10px #fff, inset 0 0 20px #4834d4; }
      50% { box-shadow: 0 0 25px #fff, inset 0 0 40px #686de0; }
      100% { box-shadow: 0 0 10px #fff, inset 0 0 20px #4834d4; }
    }

    .frame-checker {
      background-image:
        linear-gradient(45deg, #222 25%, transparent 25%),
        linear-gradient(-45deg, #222 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222 75%),
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 20px 20px;
      background-color: #eee;
      border: 3px solid var(--nfs-yellow);
      box-shadow: 0 0 10px var(--nfs-yellow);
    }

    .frame-holo {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 25%, #f093fb 50%, #f5576c 75%, #00f2fe 100%);
      background-size: 400% 400%;
      animation: holo-slide 3s linear infinite, rainbow-hue 10s linear infinite;
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes rainbow-hue {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }

    /* Класс для выбранной аватарки в окне выбора */
    .swal-avatar-item.active-choice {
      border-color: #f1c40f !important;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }

  </style>
</head>
<body>

<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 15px;">
    <img src="https://i.ibb.co/DfKw5Ywp/IMG-3707.png"
         alt="NFS Logo"
         style="height: 65px; width: auto; filter: drop-shadow(2px 2px 5px #000);">

    <div style="font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 5px #000; font-style: italic; text-transform: uppercase;">
      PLAYER PROFILE
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 15px;">
    <span id="myNickTop" style="font-weight: bold; color: var(--nfs-yellow); text-shadow: 2px 2px 4px #000;">Loading...</span>
    <button onclick="handleLogout()" style="background:rgba(0,0,0,0.6); border-radius: 5px; color:#ff4444; cursor:pointer; font-size: 0.75rem; padding: 6px 12px; font-weight: bold; text-transform: uppercase;">
      EXIT
    </button>
  </div>
</header>

<aside class="sidebar">
  <nav style="padding-top: 1px;">
    <a href="index.html" class="nav-item">MAIN</a>
    <a href="forum.html" class="nav-item">FORUM</a>
    <a href="chats.html" class="nav-item">MESSENGER<span id="msgBadge">0</span></a>
    <a href="lobby.html" class="nav-item">SEARCH THE GAME</a>
    <a href="leaderboard.html" class="nav-item">LEADERBOARD</a>
    <a href="profile.html" class="nav-item active">MY PROFILE</a>
  </nav>
</aside>

<div class="container">
  <div class="profile-card">
    <button id="editBtn" class="btn-tuning hidden" onclick="openEditProfile()">EDIT PROFILE</button>
    <div class="avatar-area">
      <div id="avatarFrame" class="avatar-container" onclick="openAvatarPicker()" style="cursor: pointer; position: relative; z-index: 10;">
        <div class="avatar-big" id="avatarBox">
          <span class="avatar-letter">?</span>
        </div>
      </div>

      <select id="statusSelect" class="hidden" onchange="updateUserStatus()">
        <option value="ONLINE">ONLINE</option>
        <option value="IN-GAME">IN-GAME</option>
        <option value="LOOKING FOR GAME">LOOKING FOR GAME</option>
        <option value="OFFLINE">OFFLINE</option>
      </select>
      <button id="msgBtn" class="btn-nfs hidden" onclick="goToChat()">✉ TO WRITE</button>
      <button id="friendBtn" class="btn-nfs hidden">ADD TO FRIENDS</button>
    </div>
    <div class="info-area">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="badgeContainer"></span>
        <h1 style="margin:0;">
          <span class="clan-tag" id="profClan">[...]</span>
          <span id="profName">Loading...</span>
        </h1>
      </div>

      <div id="muteInfo"></div>

      <p id="profBio" style="color: #aaa; font-style: italic; margin: 10px 0; font-size: 1.1rem;">Loading...</p>

      <div id="statusIndicator" class="status-badge status-online">OFFLINE</div>

      <!-- Сетка статистики, чтобы не было "каши" -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
        <div>
          <div style="font-size: 0.8rem; color: #666; text-transform: uppercase;">Rating</div>
          <div class="highlight" id="profRating" style="font-size: 1.4rem;">★ 0</div>
        </div>
        <div>
          <div style="font-size: 0.8rem; color: #666; text-transform: uppercase;">World rank</div>
          <div class="highlight" id="rankDisplay" style="font-size: 1.4rem;">#--</div>
        </div>
      </div>

      <div style="margin-top: 15px; font-size: 0.9rem; color: #777;">
        Last seen: <span id="lastSeenDisplay">...</span>
      </div>

      <button id="adminMuteBtn" class="btn-nfs hidden" style="background: #c0392b; color: #fff; border: 1px solid #ff4d4d; margin-top: 15px;" onclick="openMuteModal()">
        ⚠ ISSUE A MUT
      </button>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div class="gallery-title" id="garageTitle">RACER'S GARAGE</div>
    <button id="addCarBtn" class="btn-tuning hidden" style="position: static;" onclick="addNewCarPhoto()">+ ADD A CAR</button>
  </div>
  <div class="gallery" id="garageContainer"></div>
</div>

<footer class="bottom-bar">
  <div>ONLINE: <span class="highlight" id="footerOnline">0</span> | IN THE RACE: <span class="highlight" id="footerPlaying">0</span></div>
</footer>

  <script>
    const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (typeof onlineUsers === 'undefined') window.onlineUsers = {};

    // Константы
    const AVATAR_OPTIONS = [
    'https://cs9.pikabu.ru/post_img/2017/02/16/9/1487255861137287071.png',
    'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEveKMVakzm3H74-BgFH8JGuoTkavsfgIAaw&s',
    'https://static.wikia.nocookie.net/needforspeed/images/e/ee/TazProfileIcon.png/revision/latest/scale-to-width-down/220?cb=20160105211008&path-prefix=ru',
    'https://static.wikia.nocookie.net/nfs/images/6/6f/Sonny.png/revision/latest/smart/width/250/height/250?cb=20150519180637&path-prefix=es'
    ];

    function formatLastSeen(dateString) {
      if (!dateString) return "Long ago";

      const now = new Date();
      const lastSeen = new Date(dateString);
      const diffInSeconds = Math.floor((now - lastSeen) / 1000);

      if (diffInSeconds < 60) return "Just now";
      if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} min. ago`;
      if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} h. ago`;

      // Если прошло больше суток — показываем дату
      return lastSeen.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    let currentUserId = null, myProfile = null, profileData = null;

    window.onload = async () => {
    // 1. Проверка авторизации
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUserId = user.id;

    // 2. Загрузка личных данных (для шапки и статуса)
    const { data: me } = await _supabase.from('profiles').select('*').eq('id', currentUserId).single();
    if (me) {
    myProfile = me;
    const nickEl = document.getElementById('myNickTop');
    if (nickEl) nickEl.innerText = me.username;

    // Запускаем глобальный маяк из utils.js
    if (typeof initGlobalStatus === 'function') {
    initGlobalStatus(_supabase, me);
  }

    if (typeof updateGlobalMsgBadge === 'function') {
    updateGlobalMsgBadge(_supabase, me.id);
  }
  }

    // 3. Логика отображения профиля
    const urlParams = new URLSearchParams(window.location.search);
    const targetName = urlParams.get('u');

    if (targetName) {
    const { data } = await _supabase.from('profiles').select('*').ilike('username', targetName).maybeSingle();
    if (data) {
    profileData = data;
    renderFullProfile(data, data.id === currentUserId);
    updateRacerRank(data.id);
    if (data.id !== currentUserId) checkFriendshipStatus(data.id);
  } else {
    loadMyOwnProfile(user.id);
  }
  } else {
    loadMyOwnProfile(user.id);
  }
  };

    window.updateLiveStatusUI = function() {
      const el = document.getElementById('statusIndicator');
      if (!el || !profileData) return;

      // 1. Проверяем, видит ли радар этого пользователя в сети
      const presence = (typeof onlineUsers !== 'undefined') ? onlineUsers[profileData.username] : null;

      // 2. Если это твой профиль — ты точно в сети, даже если радар тупит
      const isItMe = (myProfile && profileData.id === myProfile.id);

      if (!presence && !isItMe) {
        // Юзер реально оффлайн
        el.innerText = 'OFFLINE';
        el.className = 'status-badge status-offline';
      } else {
        // Юзер ОНЛАЙН — теперь выбираем, какой именно статус показать
        const s = profileData.status || 'ONLINE';
        const loc = presence ? presence[0].location : '';

        // Приоритет 1: Если юзер в мессенджере
        if (loc === 'chats.html') {
          el.innerText = 'IN CHAT';
          el.className = 'status-badge status-ingame';
        }
        // Приоритет 2: Тот статус, который ты выбрала в списке (В ИГРЕ / ИЩУ ИГРУ)
        else {
          el.innerText = s;
          // Если статус боевой (игра/поиск), красим в желтый, если просто онлайн — в зеленый
          if (s === 'IN-GAME' || s === 'LOOKING FOR GAME') {
            el.className = 'status-badge status-ingame';
          } else {
            el.className = 'status-badge status-online';
          }
        }
      }
    };

    async function loadMyOwnProfile(userId) {
      try {
        const { data, error } = await _supabase.from('profiles').select('*').eq('id', userId).single();
        if (error) throw error;
        if (data) {
          profileData = data;
          renderFullProfile(data, true);
          updateRacerRank(data.id);
        }
      } catch (err) {
        console.error("Error loading your profile:", err);
        // Если даже база упала, хоть имя покажем из кеша авторизации
        document.getElementById('profName').innerText = "ERROR!";
      }
    }

    async function updateRacerRank(targetUserId) {
    const { data: racers } = await _supabase.from('profiles').select('id').order('rating', { ascending: false });
    if (racers) {
    const rank = racers.findIndex(r => r.id === targetUserId) + 1;
    const rankEl = document.getElementById('rankDisplay');
    if (rankEl) rankEl.innerText = `#${rank}`;
  }
  }

    function renderFullProfile(data, isMine) {
      // 1. Обновляем ник в шапке
      const topNick = document.getElementById('myNickTop');
      if (topNick && myProfile) topNick.innerText = myProfile.username;

      const nameEl = document.getElementById('profName');
      const badgeEl = document.getElementById('badgeContainer');

      // --- ЛОГИКА РАМОК ---
      const frameEl = document.getElementById('avatarFrame');
      if (frameEl) {
        frameEl.className = 'avatar-container';

        // 1. Если юзер САМ выбрал рамку в настройках — ставим её
        if (data.selected_frame) {
          frameEl.classList.add(data.selected_frame);
        }
        // 2. Иначе — автоматический выбор по нику или роли
        else if (data.username === 'Davenport' || data.username === 'test1') {
          frameEl.classList.add('frame-mw');
        } else if (data.is_admin) {
          frameEl.classList.add('frame-admin');
        } else if (data.is_mod) {
          frameEl.classList.add('frame-mod');
        } else if (data.is_vip) {
          frameEl.classList.add('frame-vip');
        } else {
          frameEl.classList.add('frame-default');
        }
      }

      // --- СТАТУС ONLINE / OFFLINE ---
      const lastSeenEl = document.getElementById('lastSeenDisplay');
      if (lastSeenEl) {
        const isOnline = (typeof onlineUsers !== 'undefined' && onlineUsers[data.username]);
        const isItMe = (myProfile && data.id === myProfile.id);

        if (isOnline || isItMe) {
          lastSeenEl.innerText = "Online now";
          lastSeenEl.style.color = "var(--nfs-yellow)";
        } else {
          lastSeenEl.innerText = formatLastSeen(data.last_seen);
          lastSeenEl.style.color = "#777";
        }
      }

      // --- ИМЯ И БЕЙДЖИ ---
      if (nameEl) {
        nameEl.innerText = data.username;
        if (data.is_admin) {
          nameEl.classList.add('admin-glow');
          badgeEl.innerHTML = `<span class="badge badge-admin">ADM</span>`;
        } else if (data.is_vip) {
          nameEl.classList.add('vip-glow');
          badgeEl.innerHTML = `<span class="badge badge-vip">VIP</span>`;
        } else {
          badgeEl.innerHTML = ''; // Очищаем, если обычный игрок
        }
      }

      // --- МУТЫ И МОДЕРАЦИЯ ---
      if (typeof renderMuteStatus === 'function') {
        renderMuteStatus(data);
      }

      const adminMuteBtn = document.getElementById('adminMuteBtn');
      if (adminMuteBtn) {
        if (myProfile && myProfile.is_admin && !isMine) {
          adminMuteBtn.classList.remove('hidden');
        } else {
          adminMuteBtn.classList.add('hidden');
        }
      }

      // --- ОБЩАЯ ИНФОРМАЦИЯ ---
      document.getElementById('profBio').innerText = data.bio || "Elite racer of Rockport";
      document.getElementById('profRating').innerText = `★ ${data.rating.toLocaleString()}`;

      const box = document.getElementById('avatarBox');
      if (box) {
        box.innerHTML = data.avatar_url
          ? `<img src="${data.avatar_url}" style="width:100%; height:100%; object-fit:cover;">`
          : `<span class="avatar-letter">${data.username[0].toUpperCase()}</span>`;
      }

      const clanEl = document.getElementById('profClan');
      if (clanEl) clanEl.innerText = data.clan_tag || '[NONE]';

      renderGarage(data.photos);

      // Обновляем статус (В ЧАТЕ / В ИГРЕ)
      if (typeof window.updateLiveStatusUI === 'function') {
        window.updateLiveStatusUI();
      }

      // --- КНОПКИ УПРАВЛЕНИЯ ---
      const editBtn = document.getElementById('editBtn');
      const statusSelect = document.getElementById('statusSelect');
      const addCarBtn = document.getElementById('addCarBtn');
      const msgBtn = document.getElementById('msgBtn');
      const friendBtn = document.getElementById('friendBtn');

      if (isMine) {
        if (editBtn) editBtn.classList.remove('hidden');
        if (statusSelect) {
          statusSelect.classList.remove('hidden');
          statusSelect.value = data.status || 'ONLINE';
        }
        if (addCarBtn) addCarBtn.classList.remove('hidden');
        if (msgBtn) msgBtn.classList.add('hidden');
        if (friendBtn) friendBtn.classList.add('hidden');
      } else {
        if (editBtn) editBtn.classList.add('hidden');
        if (statusSelect) statusSelect.classList.add('hidden');
        if (addCarBtn) addCarBtn.classList.add('hidden');
        if (msgBtn) msgBtn.classList.remove('hidden');
        if (friendBtn) friendBtn.classList.remove('hidden');
      }
    }

    function renderGarage(photos) {
    const container = document.getElementById('garageContainer');
    if (!container) return;
    container.innerHTML = photos?.length ? '' : '<p style="color:#555">Avoid...</p>';
    photos?.forEach((url, i) => {
    container.innerHTML += `
        <div class="car-card" onclick="viewFullImage('${url}')">
          <img src="${url}">
          <div style="padding:10px; display:flex; justify-content:space-between; background:rgba(0,0,0,0.8);">
            <span style="color:var(--nfs-yellow); font-size:0.8rem; font-weight:bold;">PHOTO #${i+1}</span>
          </div>
        </div>`;
  });
  }

    function viewFullImage(url) {
    Swal.fire({
      imageUrl: url,
      background: 'rgba(0,0,0,0.9)',
      showConfirmButton: false,
      showCloseButton: true,
      width: 'auto'
    });
  }

    async function addNewCarPhoto() {
      const { value: url } = await Swal.fire({
        title: 'GARAGE TUNING',
        background: '#0a0a0a',
        color: '#fff',
        input: 'url',
        inputLabel: 'STEP 1: Add your photo on PostImages\nSTEP 2: Insert a DIRECT LINK below (.jpg, .png)',
        inputPlaceholder: 'https://i.postimg.cc/..../image.jpg',
        confirmButtonText: 'IN GARAGE',
        confirmButtonColor: '#f1c40f',

        footer: '<a href="https://postimages.org/" target="_blank" style="color: #f1c40f; font-weight: bold; text-decoration: underline;">TO OPEN POSTIMAGES.ORG</a>',
        showCancelButton: true,
        cancelButtonText: 'CANCEL'
      });

      if (url) {
        // Проверка на прямую ссылку (чтобы не сломать верстку)
        if (!url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
          Swal.fire({
            title: 'ERROR',
            text: 'That`s not direct link! Choose on PostImages a line "Direct link"',
            icon: 'error',
            background: '#0a0a0a',
            color: '#fff'
          });
          return;
        }

        // Сохраняем в массив photos таблицы profiles
        const currentPhotos = Array.isArray(profileData.photos) ? profileData.photos : [];
        const updatedPhotos = [...currentPhotos, url];

        const { error } = await _supabase
          .from('profiles')
          .update({ photos: updatedPhotos })
          .eq('id', currentUserId);

        if (!error) {
          if (typeof nfsNotify === 'function') nfsNotify('Your auto has been added!');
          setTimeout(() => location.reload(), 1200);
        } else {
          console.error(error);
        }
      }
    }

    async function updateUserStatus() {
      const s = document.getElementById('statusSelect').value;

      // 1. Сохраняем в базу навсегда
      const { error } = await _supabase.from('profiles').update({ status: s }).eq('id', currentUserId);

      if (!error) {
        // 2. Обновляем локальные данные профиля
        if (profileData) profileData.status = s;
        if (myProfile) myProfile.status = s;

        // 3. Вещаем новый статус в радар (Presence) через utils.js
        if (typeof window.trackMyStatus === 'function') {
          await window.trackMyStatus(s);
        }

        // 4. Мгновенно обновляем плашку на странице без перезагрузки
        window.updateLiveStatusUI();

        // Фирменное уведомление
        if (typeof nfsNotify === 'function') {
          nfsNotify('Статус обновлен: ' + s);
        }
      }
    }

    async function openEditProfile() {
      // Список доступных рамок
      const frames = [
        // Базовые и Ролевые
        { id: 'frame-default', name: 'Stardart' },
        { id: 'frame-mw', name: 'Most Wanted' },
        { id: 'frame-admin', name: 'Red Neon' },

        // Эффекты стихий и частиц
        { id: 'frame-purple', name: 'Ghost Purple' },
        { id: 'frame-toxic', name: 'Toxic Green' },
        { id: 'frame-sparks', name: 'Nitro Sparks' },
        { id: 'frame-ice', name: 'Ice Cold' },

        // Агрессивные и необычные
        { id: 'frame-void', name: 'Event Horizon' },
        { id: 'frame-checker', name: 'Winner Check' },
        { id: 'frame-carbon', name: 'Pro Carbon' },
        { id: 'frame-holo', name: 'Cosmos Edge' },
      ];

      let framesHtml = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">';
      frames.forEach(f => {
        const isSelected = profileData.selected_frame === f.id ? 'border: 2px solid var(--nfs-yellow);' : 'border: 1px solid #333;';
        framesHtml += `
      <div onclick="selectFrame('${f.id}')" id="${f.id}" class="frame-preview ${f.id}"
           style="cursor:pointer; padding:10px; ${isSelected} background: rgba(0,0,0,0.5); font-size: 0.7rem;">
        ${f.name.toUpperCase()}
      </div>`;
      });
      framesHtml += '</div>';

      const { value: formValues } = await Swal.fire({
        background: '#0a0a0a', color: '#fff',
        html: `
      <p style="font-size:0.8rem;">BIO:</p>
      <input id="swal-bio" class="swal2-input" value="${profileData.bio || ''}" style="background:#111; color:#fff; width:80%;">
      <p style="margin-top:15px; font-size:0.8rem;">FRAME SELECTION:</p>
      ${framesHtml}
    `,
        showCancelButton: true,
        confirmButtonText: 'TO SET IT!',
        preConfirm: () => {
          return {
            bio: document.getElementById('swal-bio').value,
            frame: window.tempSelectedFrame || profileData.selected_frame
          }
        }
      });

      if (formValues) {
        const { error } = await _supabase
          .from('profiles')
          .update({ bio: formValues.bio, selected_frame: formValues.frame })
          .eq('id', currentUserId);

        if (!error) location.reload();
      }
    }

    // Вспомогательная функция для выбора в модалке
    window.selectFrame = (id) => {
      window.tempSelectedFrame = id;
      document.querySelectorAll('.frame-preview').forEach(el => el.style.border = '1px solid #333');
      document.getElementById(id).style.border = '2px solid var(--nfs-yellow)';
    };

    function selectSwalAvatar(el, url) {
    document.querySelectorAll('.swal-avatar-item').forEach(img => img.classList.remove('selected'));
    el.classList.add('selected');
  }

    async function checkFriendshipStatus(targetUserId) {
      const {data: request} = await _supabase.from('friend_requests').select('*').or(`and(sender_id.eq.${myProfile.id},receiver_id.eq.${targetUserId}),and(sender_id.eq.${targetUserId},receiver_id.eq.${myProfile.id})`).maybeSingle();
      const btn = document.getElementById('friendBtn');
      if (!btn) return;
      btn.classList.remove('hidden');
      if (!request) {
        btn.innerText = "ADD TO FRIENDS";
        btn.onclick = () => sendFriendRequest(targetUserId);
      } else if (request.status === 'pending') {
        if (request.sender_id === myProfile.id) {
          btn.innerText = "THE REQUEST HAS BEEN SENT";
          btn.disabled = true;
        } else {
          btn.innerText = "ACCEPT THE REQUEST";
          btn.onclick = () => acceptFriendRequest(request.id);
        }
      } else if (request.status === 'accepted') {
        btn.innerText = "REMOVE FROM FRIENDS";
        // Применяем стиль опасности
        btn.style.background = "#e74c3c"; // Насыщенный красный
        btn.style.color = "#fff";
        btn.style.border = "2px solid #c0392b";
        btn.style.boxShadow = "0 0 10px rgba(231, 76, 60, 0.4)";

        btn.onclick = () => removeFriend(request.id);
      }
    }

    async function sendFriendRequest(targetId) { await _supabase.from('friend_requests').insert([{ sender_id: myProfile.id, receiver_id: targetId, sender_name: myProfile.username }]); location.reload(); }
    async function acceptFriendRequest(requestId) { await _supabase.from('friend_requests').update({ status: 'accepted' }).eq('id', requestId); location.reload(); }
    async function removeFriend(requestId) { await _supabase.from('friend_requests').delete().eq('id', requestId); location.reload(); }

    async function openMuteModal() {
      if (!myProfile || !myProfile.is_admin) return;

      // Проверяем, загружены ли данные того, кого мутим
      if (!profileData) {
        nfsNotify('ERROR: Player data is not uploaded', 'error');
        return;
      }

      const { value: minutes } = await Swal.fire({
        title: 'ВЫДАТЬ МУТ',
        input: 'select',
        inputOptions: {
          '15': '15 минут',
          '60': '1 час',
          '1440': '24 часа',
          '10080': '7 дней'
        },
        inputPlaceholder: 'Выберите срок наказания',
        showCancelButton: true,
        background: '#0a0a0a',
        color: '#ffffff',
        confirmButtonColor: '#ff4d4d',
        confirmButtonText: 'ЗАМУТИТЬ'
      });

      if (minutes) {
        const mutedUntil = new Date(Date.now() + minutes * 60000).toISOString();

        // ИСПРАВЛЕНО: используем profileData.id вместо несуществующей targetName
        const { error } = await _supabase
          .from('profiles')
          .update({ muted_until: mutedUntil })
          .eq('id', profileData.id);

        if (!error) {
          if (typeof nfsNotify === 'function') nfsNotify('НАРУШИТЕЛЬ ОШТРАФОВАН!');

          // Чтобы плашка появилась сразу:
          profileData.muted_until = mutedUntil;
          if (typeof renderMuteStatus === 'function') renderMuteStatus(profileData);

          setTimeout(() => location.reload(), 1200);
        } else {
          console.error("ERROR Supabase:", error);
          nfsNotify('Error when updating the database', 'error');
        }
      }
    }

    function renderMuteStatus(profile) {
      const container = document.getElementById('muteInfo');
      if (!container) return;

      // Если в базе пусто — выходим
      if (!profile.muted_until) {
        container.innerHTML = '';
        return;
      }

      const now = new Date();
      const muteDate = new Date(profile.muted_until);

      // ЛОГ F12
      console.log("Текущее время:", now);
      console.log("Мут до:", muteDate);

      if (muteDate > now) {
        // Вычисляем разницу
        const diffMs = muteDate - now;
        const diffMins = Math.ceil(diffMs / 60000);
        const diffHours = Math.floor(diffMins / 60);
        const remainingMins = diffMins % 60;

        let timeText = diffHours > 0
          ? `${diffHours} h. ${remainingMins} min.`
          : `${diffMins} min.`;

        container.innerHTML = `
      <div style="background: rgba(255, 77, 77, 0.2); border-left: 4px solid #ff4d4d; padding: 12px; margin: 15px 0; color: #ff4d4d; font-family: 'Segoe UI', sans-serif; box-shadow: 0 0 15px rgba(255, 77, 77, 0.1);">
        <div style="font-weight: 900; letter-spacing: 1px; font-size: 0.85rem; text-transform: uppercase;">
          ⚠ STATUS: PLAYER IN MUTE
        </div>
        <div style="color: #fff; font-size: 0.8rem; margin-top: 5px; font-style: italic;">
          ACCESS IS LIMITED. <br>
          The term expires in: <span style="color: #ff4d4d; font-weight: bold;">${timeText}</span>
        </div>
      </div>
    `;
      } else {
        // Если время вышло, просто очищаем блок
        container.innerHTML = '';
      }
    }

    function goToChat() { window.location.href = `chats.html?to=${profileData.username}`; }

    async function handleLogout() {
    if (currentUserId) await _supabase.from('profiles').update({ status: 'OFFLINE' }).eq('id', currentUserId);
    await _supabase.auth.signOut();
    window.location.href = 'auth.html';
  }

    async function openAvatarPicker() {
      if (!myProfile || profileData.id !== myProfile.id) return;

      // Генерируем HTML: убираем сложные стили из строк
      let iconsHtml = '<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:15px; padding:10px;">';
      AVATAR_OPTIONS.forEach(url => {
        const isSelected = profileData.avatar_url === url;
        iconsHtml += `
      <img src="${url}"
           class="swal-avatar-item ${isSelected ? 'active-choice' : ''}"
           style="width:80px; height:80px; cursor:pointer; border:3px solid transparent; border-radius:5px; transition:0.2s;"
           onclick="selectSwalAvatarOnly(this)">`;
      });
      iconsHtml += '</div>';

      const { value: selectedUrl } = await Swal.fire({
        title: 'IMAGE SELECTION',
        background: '#0a0a0a',
        color: '#fff',
        html: `
      <p style="font-size:0.9rem; color: #f1c40f; margin-bottom:15px;">CHOOSE A NEW IMAGE:</p>
      ${iconsHtml}
    `,
        showCancelButton: true,
        confirmButtonText: 'TO SET IT!',
        confirmButtonColor: '#f1c40f',
        preConfirm: () => {
          return window.tempAvatarUrl || profileData.avatar_url;
        }
      });

      if (selectedUrl) {
        const { error } = await _supabase
          .from('profiles')
          .update({ avatar_url: selectedUrl })
          .eq('id', currentUserId);

        if (!error) location.reload();
      }
    }

    // Исправленная функция клика
    window.selectSwalAvatarOnly = (el) => {
      // Убираем класс у всех
      document.querySelectorAll('.swal-avatar-item').forEach(img => {
        img.classList.remove('active-choice');
      });

      // Добавляем класс только нажатой картинке
      el.classList.add('active-choice');
      window.tempAvatarUrl = el.src;
    };
</script>
