<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>NFS Portal | Forum</title>

  <link rel="shortcut icon" href="/IMG_3707.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --nfs-yellow: #f1c40f;
      --nfs-dark: #0a0a0a;
      --admin-red: #e74c3c;
    }

    body {
      margin: 0; background: url('https://cdn.gracza.pl/i/h/22/426884066.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: "Garamond", "Baskerville", "Playfair Display", Georgia, serif;
      overflow-x: hidden;
      padding-bottom: 60px;
    }


    /* УВЕДОМЛЕНИЯ */
    .notifications-wrapper {
      position: relative;
      margin-right: 20px;
      display: flex;
      align-items: center;
    }

    #notifyBell {
      cursor: pointer;
      position: relative;
      font-size: 22px;
      transition: 0.2s;
    }

    #notifyBell:hover {
      transform: scale(1.1);
    }

    #notifyCount {
      position: absolute;
      top: -5px;
      right: -8px;
      background: var(--admin-red);
      color: white;
      border-radius: 50%;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid white;
      display: none;
    }

    .main-sidebar {
      width: 250px;
      background: var(--nfs-dark);
      height: 100vh;
      position: fixed;
      top: 70px;
      border-right: 2px solid #333;
      z-index: 900;
    }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      transition: 0.3s;
      font-size: 0.85rem;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background: rgba(241,196,15,0.1);
      border-left: 5px solid var(--nfs-yellow);
    }

    .top-navbar {
      height: 70px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      box-sizing: border-box;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
      repeating-linear-gradient(-45deg, #0a0a0a, #0a0a0a 40px, rgba(241, 196, 15, 0.4) 40px, rgba(241, 196, 15, 0.4) 80px);
      border-bottom: 2px solid var(--nfs-yellow);
      box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    }

    .title-container {
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 5px #000;
    }

    #myNickContainer {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .sidebar {
      width: 250px;
      background: var(--nfs-dark);
      height: 100vh;
      position: fixed;
      top: 70px;
      border-right: 2px solid #333;
      z-index: 1000;
    }

    .nav-item {
      display: block;
      padding: 20px 30px;
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    /* СТИЛЬ ДЛЯ БЕЙДЖА СООБЩЕНИЙ */
    #msgBadge {
      background: var(--nfs-yellow); color: #000; padding: 2px 6px;
      font-size: 0.7rem; font-weight: 900; border-radius: 2px;
      margin-left: 8px; box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
      display: none; /* Скрыт по умолчанию */
    }

    .container {
      margin-left: 280px;
      padding: 120px 50px 50px 50px;
    }

    h1 {
      font-style: italic;
      text-transform: uppercase;
      /*border-bottom: 3px solid var(--nfs-yellow);*/
      display: inline-block;
      margin-bottom: 30px;
    }

    .create-topic-box {
      background: rgba(0,0,0,0.8);
      border: 1px solid #333;
      padding: 25px;
      margin-bottom: 40px;
    }

    input, textarea {
      width: 100%;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      margin-bottom: 15px;
      box-sizing: border-box;
      outline: none;
      resize: none;
    }

    input:focus, textarea:focus {
      border-color: var(--nfs-yellow);
    }

    .btn-create {
      background: var(--nfs-yellow);
      color: #000;
      border: none;
      padding: 12px 25px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-create:hover {
      color: #000000;
      background-color: #c1970e;
      transition: 0.3s; /* плавность изменения цвета */
    }

    .topic-card {
      background: rgba(15,15,15,0.95);
      padding: 25px;
      margin-bottom: 20px;
      transition: 0.3s;
      cursor: pointer;
    }

    .topic-title {
      font-size: 1.8rem;
      color: var(--nfs-yellow);
      margin: 0 0 10px;
      text-transform: uppercase;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px #000;
    }

    .topic-title:hover {
      color: #ea0000;
    }

    .topic-meta {
      font-size: 0.8rem;
      color: #777;
    }

    /* ФУТЕР И ПОИСК */
    .bottom-bar {
      position: fixed; bottom: 0; width: 100%;
      background: rgba(0,0,0,0.95); padding: 15px 0;
      border-top: 2px solid var(--nfs-yellow);
      text-align: center; font-size: 0.9rem; z-index: 1000;
      text-transform: uppercase; letter-spacing: 1px;
    }

    .highlight { color: var(--nfs-yellow); font-weight: bold; }

    /* ==========================================================================
   АДАПТИВНАЯ ВЕРСТКА ДЛЯ ФОРУМА (ЭКРАНЫ МЕНЬШЕ 768px)
   ========================================================================== */
    @media screen and (max-width: 768px) {

      /* 1. ШАПКА САЙТА */
      .top-navbar {
        padding: 0 15px !important;
      }

      .top-navbar div[style*="font-size: 1.8rem"] {
        font-size: 1.3rem !important; /* Уменьшаем заголовок "FORUM" */
      }

      #displayNick {
        max-width: 80px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 2. ПЕРЕНОС САЙДБАРА НАВЕРХ */
      .sidebar {
        position: relative !important; /* Отвязываем от фиксации слева */
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin-top: 70px !important; /* Встает ровно под шапку */
        border-right: none !important;
        border-bottom: 2px solid #333 !important;
        z-index: 999 !important;
      }

      .sidebar nav {
        display: flex !important;
        flex-wrap: wrap !important;
        justify-content: space-around !important;
        padding-top: 0 !important;
      }

      .nav-item {
        flex: 1 1 30% !important; /* Кнопки делят экран по три в ряд */
        min-width: 95px !important;
        padding: 12px 5px !important;
        font-size: 0.75rem !important;
        text-align: center !important;
        border-bottom: 1px solid #222 !important;
        box-sizing: border-box !important;
      }

      .nav-item:hover, .nav-item.active {
        border-left: none !important;
        border-bottom: 3px solid var(--nfs-yellow) !important; /* Желтая линия активности теперь снизу */
      }

      /* 3. ОСНОВНОЙ КОНТЕНТ */
      .container {
        margin-left: 0 !important; /* Убираем левый десктопный отступ */
        padding: 20px 15px 100px 15px !important; /* Задаем аккуратные мобильные отступы */
        box-sizing: border-box !important;
        width: 100% !important;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 20px;
        display: block;
        text-align: center; /* Центрируем заголовок "GAME DISCUSSIONS" */
      }

      /* Блок создания новой темы */
      .create-topic-box {
        padding: 15px !important; /* Делаем форму создания темы компактнее */
        margin-bottom: 25px !important;
      }

      input, textarea {
        padding: 10px !important;
        font-size: 0.95rem !important;
      }

      .btn-create {
        width: 100%; /* Кнопка публикации растягивается на весь экран для удобного тапа */
        text-align: center;
      }

      /* Карточки обсуждений */
      .topic-card {
        padding: 15px !important; /* Чуть уменьшаем внутренние отступы карточек */
        margin-bottom: 15px !important;
      }

      .topic-title {
        font-size: 1.3rem !important; /* Сжимаем слишком крупные заголовки тем */
        line-height: 1.3;
      }

      /* 4. НИЖНЯЯ ПАНЕЛЬ */
      .bottom-bar {
        font-size: 0.75rem !important;
        padding: 12px 0 !important;
      }
    }
  </style>
</head>
<body>

<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 20px;">
    <img src="https://i.ibb.co/DfKw5Ywp/IMG-3707.png"
         alt="NFS Logo"
         style="height: 65px; width: auto; filter: drop-shadow(2px 2px 8px #000);">

    <div style="font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 5px #000; font-style: italic; text-transform: uppercase;">
      FORUM
    </div>
  </div>

  <div class="user-area" style="display: flex; align-items: center; gap: 20px;">

    <div class="notifications-wrapper" id="notifyWrapper" style="position: relative; display: flex; align-items: center;">

      <div id="notifyBell" onclick="toggleNotifyPopup()" style="cursor: pointer; display: flex; align-items: center;">
        <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notifyCount" style="margin-left: 5px;">0</span>
      </div>

      <div id="notifyPopup" style="display: none; position: absolute; top: 100%; right: 0; background: #1a1a1a; border: 1px solid #333; z-index: 100; min-width: 200px; margin-top: 10px;">
        <div class="notify-header" style="padding: 10px; color: #fff; border-bottom: 1px solid #333; font-family: sans-serif; text-transform: uppercase; font-size: 0.8rem;">Friend requests</div>
        <div id="notifyList"></div>
      </div>

    </div> <button class="btn-login" id="loginBtn" onclick="openModal()" style="display: none;">LOGIN</button>

    <div class="user-info" id="userInfo" style="display: flex; align-items: center; gap: 15px;">
    <span id="displayNick" style="font-weight: bold; cursor: pointer; color: #ffffff; text-shadow: 0 0 8px rgba(0,0,0,0.6);" onclick="window.location.href='profile.html'">
      Davenport
    </span>
      <button onclick="handleLogout()" style="background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 5px; color: #ff4444; cursor: pointer; font-size: 0.75rem; padding: 6px 12px; font-weight: bold; text-transform: uppercase;">
        EXIT
      </button>
    </div>
  </div>
</header>

<aside class="sidebar">
  <nav style="padding-top: 20px;">
    <a href="index.html" class="nav-item">MAIN</a>
    <a href="forum.html" class="nav-item active">FORUM</a>
    <a href="chats.html" class="nav-item">MESSENGER<span id="msgBadge">0</span></a>
    <a href="lobby.html" class="nav-item">SEARCH THE GAME</a>
    <a href="leaderboard.html" class="nav-item">LEADERBOARD</a>
    <a href="profile.html" class="nav-item">MY PROFILE</a>
  </nav>
</aside>

<div class="container">
  <h1>GAME DISCUSSIONS</h1>
  <div class="create-topic-box">
    <h3 style="margin-top:0; color: var(--nfs-yellow); font-style: italic;">NEW DISCUSSION</h3>
    <input type="text" id="topicTitle" placeholder="Enter title here...">
    <textarea id="topicContent" rows="3" placeholder="What we'll talk about?.."></textarea>
    <button class="btn-create"
            style="border-radius: 6px"
            onclick="createNewTopic()">Publish it!</button>
  </div>
  <div id="topicsList"></div>
</div>

<footer class="bottom-bar">
  <div>ONLINE: <span class="highlight" id="footerOnline">0</span> | IN THE RACE: <span class="highlight" id="footerPlaying">0</span></div>
</footer>

<script>
  const SUPABASE_URL = 'https://obeavooabtzadlcmybel.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_qLmZZzwjyqF6ZO8BCoKj2A_a9oHPA2z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let myProfile = null;
  let userProfile = null;

  window.onload = async () => {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'auth.html'; return; }

    const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();

    if (profile) {
      userProfile = profile;

      const nickEl = document.getElementById('displayNick');
      if (nickEl) {
        nickEl.innerText = userProfile.username;
      }

      if (typeof updateFriendNotifications === 'function') {
        updateFriendNotifications();
      }

      initOnlineRadar(profile.username, profile.status);
      updateMessageBadge();

      _supabase.channel('forum-msg-updates')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `receiver_id=eq.${user.id}` }, () => {
          updateMessageBadge();
        })
        .subscribe();
    }
    loadTopics();
  };

  async function updateMessageBadge() {
    if (!userProfile) return;
    const { count } = await _supabase
      .from('direct_messages')
      .select('*', { count: 'exact', head: true })
      .eq('receiver_id', userProfile.id)
      .eq('is_read', false);

    const b = document.getElementById('msgBadge');
    if (count > 0) {
      b.innerText = count;
      b.style.display = 'inline-block';
    } else {
      b.style.display = 'none';
    }
  }

  function initOnlineRadar(username, status) {
    const presenceChannel = _supabase.channel('online-users', { config: { presence: { key: username } } });
    presenceChannel.on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      let total = 0; let playing = 0;
      for (const key in state) {
        total++;
        const s = state[key][0].status;
        if (s === 'IN-GAME' || s === 'LOOKING FOR GAME') playing++;
      }
      document.getElementById('footerOnline').innerText = total;
      document.getElementById('footerPlaying').innerText = playing;
    }).subscribe(async (s) => {
      if (s === 'SUBSCRIBED') await presenceChannel.track({ online_at: new Date().toISOString(), status: status });
    });
  }

  async function loadTopics() {
    const { data } = await _supabase.from('forum_topics').select('*').order('created_at', { ascending: false });
    const list = document.getElementById('topicsList');
    list.innerHTML = '';
    if (data) {
      data.forEach(topic => {
        const date = new Date(topic.created_at).toLocaleDateString();
        list.innerHTML += `
          <div class="topic-card"
          onclick="window.location.href='topic.html?id=${topic.id}'">
            <div class="topic-title">${topic.title}</div>
            <div style="margin-bottom: 10px;
            color: #ccc;">${topic.content.substring(0, 120)}${topic.content.length > 120 ? '...' : ''}</div>
            <div class="topic-meta">Autor: <strong>${topic.author_name}</strong> • ${date}</div>
          </div>
        `;
      });
    }
  }

  function toggleNotifyPopup() {
    const p = document.getElementById('notifyPopup');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }

  async function updateFriendNotifications() {
    if (!myProfile) return;
    const { data: requests } = await _supabase.from('friend_requests')
      .select('*')
      .eq('receiver_id', myProfile.id)
      .eq('status', 'pending');

    const countEl = document.getElementById('notifyCount');
    const listEl = document.getElementById('notifyList');

    if (requests && requests.length > 0) {
      countEl.innerText = requests.length;
      countEl.style.display = 'block'; // Показываем красный кружок с цифрой
      listEl.innerHTML = '';
      requests.forEach(req => {
        listEl.innerHTML += `
                    <div class="notify-item">
                        <b>${req.sender_name}</b> wants to be friends
                        <div class="notify-btns">
                            <button class="btn-acc" onclick="respondFriend('${req.id}', 'accepted')">ОК</button>
                            <button class="btn-rej" onclick="respondFriend('${req.id}', 'rejected')">NO</button>
                        </div>
                    </div>`;
      });
    } else {
      countEl.style.display = 'none'; // Прячем кружок, если запросов нет
      listEl.innerHTML = '<div style="padding:10px; font-size:10px; color:#444; text-align:center;">There are no requests</div>';
    }
  }

  async function respondFriend(reqId, status) {
    try {
      if (status === 'accepted') {
        await _supabase.from('friend_requests').update({ status: 'accepted' }).eq('id', reqId);
        if (typeof nfsNotify === 'function') nfsNotify('Racer added to friends!');
      } else {
        await _supabase.from('friend_requests').delete().eq('id', reqId);
        if (typeof nfsNotify === 'function') nfsNotify('Your request has been reject', 'info');
      }

      // Мгновенно обновляем интерфейс
      await updateFriendNotifications();
      await loadSidebarFriends();
    } catch (err) {
      console.error("Error when responding to a request:", err);
    }
  }

  async function createNewTopic() {
    const title = document.getElementById('topicTitle').value.trim();
    const content = document.getElementById('topicContent').value.trim();
    if (!title || !content) return;
    const { error } = await _supabase.from('forum_topics').insert([{ title, content, author_name: userProfile.username, author_id: userProfile.id }]);
    if (!error) { document.getElementById('topicTitle').value = ''; document.getElementById('topicContent').value = ''; loadTopics(); }
  }

  async function handleLogout() { await _supabase.auth.signOut(); window.location.href = 'auth.html'; }
</script>
</body>
</html>
